<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">TeamAct 两阶段交接事务：计划主路径与恢复共用提交内核</title>
  <desc id="desc">本图以计划性交接展示两阶段主路径；恢复变体在多源重建后，由 RecoveryPolicy 代行缺席 holder 的授权，并以 sourceState=suspended 复用相同的 prepare、ack、commit 与 abort 内核。恢复材料从哪里来由崩溃恢复图说明。授权集签 TransferIntentCore 的 coreIntentDigest；prepare 原子产出 PreparedTransfer；接收方 ack 绑定 preparedTransferDigest；commit 单次 CAS 校验整条 digest 链与版本集后原子迁移并 fence 旧版本；abort 原样恢复 sourceState，core 一次性。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F8FBFF"/><stop offset="1" stop-color="#F4F1FF"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#1E293B" flood-opacity=".10"/></filter>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M1,1 L10,5.5 L1,10 Z" fill="#64748B"/></marker>
    <marker id="blueArrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M1,1 L10,5.5 L1,10 Z" fill="#2563EB"/></marker>
    <marker id="redArrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M1,1 L10,5.5 L1,10 Z" fill="#DC2626"/></marker>
    <style>
      .f{font-family:Inter,'Noto Sans CJK SC','PingFang SC',sans-serif}
      .title{font-size:34px;font-weight:750;fill:#172554}
      .sub{font-size:17px;fill:#64748B}
      .lane{font-size:19px;font-weight:750;fill:#334155}
      .h{font-size:18px;font-weight:750;fill:#172554}
      .b{font-size:13.5px;fill:#475569}
      .mono{font-size:13px;fill:#1E40AF}
      .note{font-size:13px;fill:#64748B}
      .hL{font-size:18px;font-weight:750;fill:#E2E8F0}
      .bL{font-size:13.5px;fill:#94A3B8}
      .bB{font-size:13.5px;fill:#BAE6FD}
      .node{filter:url(#shadow)}
    </style>
  </defs>
  <rect width="1600" height="900" rx="32" fill="url(#bg)"/>
  <text x="82" y="80" class="f title">Handoff：两阶段交接事务（计划主路径）</text>
  <text x="82" y="112" class="f sub">计划性交接展示完整主路径；崩溃恢复在多源重建后复用同一授权 / ack / commit 内核（材料来源见 ④′）</text>

  <!-- lanes -->
  <text x="180" y="164" class="f lane">A（前任）与授权者们</text>
  <text x="720" y="164" class="f lane">协调账本</text>
  <text x="1240" y="164" class="f lane">B（继任）</text>
  <g stroke="#E2E8F0" stroke-width="2"><path d="M290 180 L290 830"/><path d="M800 180 L800 830"/><path d="M1300 180 L1300 830"/></g>

  <!-- Step 1: authorization -->
  <g class="node">
    <rect x="90" y="196" width="400" height="128" rx="16" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
    <text x="112" y="228" class="f h">① 授权集（AND，逐分量）</text>
    <text x="112" y="254" class="f b">Assignment 易主：由当前 responsibleActor 授权</text>
    <text x="112" y="276" class="f b">grantSet 每个 scope：由该 scope 持有者分别授权</text>
    <text x="112" y="298" class="f b">恢复复用：RecoveryPolicy 代行缺席 holder 的授权</text>
    <text x="112" y="318" class="f note">每份授权绑定 coreIntentDigest——不可跨 intent 重放</text>
  </g>
  <g class="node">
    <rect x="560" y="196" width="480" height="128" rx="16" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
    <text x="582" y="228" class="f h">TransferIntentCore（不可变，签发前即完整）</text>
    <text x="582" y="256" class="f mono">{ transferId, workUnitId, targetActor, sourceState,</text>
    <text x="582" y="278" class="f mono">&#160;&#160;expectedAssignmentVersion, grantSet[…], expiresAt }</text>
    <text x="582" y="308" class="f note">sourceState：计划 = assigned；恢复 = suspended（abort 原样恢复）</text>
  </g>
  <path d="M490 258 L556 258" stroke="#2563EB" stroke-width="2.5" fill="none" marker-end="url(#blueArrow)"/>

  <!-- Step 2: prepare -->
  <g class="node">
    <rect x="560" y="360" width="480" height="150" rx="16" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
    <text x="582" y="392" class="f h">② prepare（同一账本事务原子完成）</text>
    <text x="582" y="418" class="f b">校验完整授权集 → 按 grantSet 只冻结随迁 scope</text>
    <text x="582" y="440" class="f b">定版快照 snapshotId · 封存在途副作用清单 manifest</text>
    <text x="582" y="468" class="f mono">→ PreparedTransfer{ transferId, coreIntentDigest,</text>
    <text x="582" y="490" class="f mono">&#160;&#160;&#160;snapshotId, manifestDigest }（唯一，不可替换）</text>
  </g>
  <path d="M800 324 L800 356" stroke="#64748B" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <text x="96" y="436" class="f note">A 不得再以被冻结的随迁 scope 准入新副作用</text>
  <text x="96" y="456" class="f note">（未随迁 scope 与其他 WorkUnit 不受影响）；</text>
  <text x="96" y="476" class="f note">在途结果走 effect receipt 窄通道（认证根准入时已固化）</text>

  <!-- Step 3: ack -->
  <g class="node">
    <rect x="1110" y="360" width="400" height="150" rx="16" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
    <text x="1132" y="392" class="f h">③ accept + context.ack</text>
    <text x="1132" y="418" class="f b">ack 绑定 preparedTransferDigest</text>
    <text x="1132" y="440" class="f b">（经 coreIntentDigest 传递绑定 transferId</text>
    <text x="1132" y="462" class="f b">与 targetActor——旧 ack 不可重放）</text>
    <text x="1132" y="490" class="f note">B 精确确认快照与在途清单，不会重复执行</text>
  </g>
  <path d="M1044 435 L1106 435" stroke="#059669" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>

  <!-- Step 4: commit -->
  <g class="node">
    <rect x="560" y="556" width="480" height="168" rx="16" fill="#0F172A"/>
    <text x="582" y="590" class="f hL">④ transfer.commit（单次 CAS，同一 digest 链）</text>
    <text x="582" y="618" class="f bL">core 未过期未消费 · 完整授权集绑 coreIntentDigest</text>
    <text x="582" y="640" class="f bL">viaPolicy：policyVersion 仍 active 且授权集满足该版 quorum/职责分离</text>
    <text x="582" y="662" class="f bL">唯一 PreparedTransfer · ack 绑该 digest · 版本集全部仍匹配</text>
    <text x="582" y="694" class="f bB">→ 原子迁移 Assignment(v+1) 与 Grants，fence 旧版本；</text>
    <text x="582" y="714" class="f bB">&#160;&#160;&#160;manifest 未决项成为 B 的显式对账义务</text>
  </g>
  <path d="M1200 514 C1160 560 1100 590 1044 610" stroke="#64748B" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M800 514 L800 552" stroke="#64748B" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>

  <!-- readiness note -->
  <g class="node">
    <rect x="1110" y="600" width="400" height="96" rx="16" fill="#FFFFFF" stroke="#059669" stroke-width="2"/>
    <text x="1132" y="632" class="f h">B 获权那一刻已就绪</text>
    <text x="1132" y="658" class="f b">validAuthority ∧ contextAcknowledged</text>
    <text x="1132" y="680" class="f b">∧ manifestAcknowledged 是 commit 前置</text>
  </g>
  <path d="M1044 660 L1106 660" stroke="#059669" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>

  <!-- abort branch -->
  <g class="node">
    <rect x="90" y="556" width="400" height="168" rx="16" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
    <text x="112" y="590" class="f h" fill="#991B1B">超时 / 失败 → abort</text>
    <text x="112" y="618" class="f b">原样恢复 sourceState：</text>
    <text x="112" y="640" class="f b">assigned 源 → 解除冻结，A 恢复职权</text>
    <text x="112" y="662" class="f b">suspended 源 → 维持 suspended（不复活失联者）</text>
    <text x="112" y="692" class="f note">core 就此消费终结（一次性）——重试须签发新</text>
    <text x="112" y="712" class="f note">TransferIntentCore 并重新走授权集</text>
  </g>
  <path d="M556 620 L494 620" stroke="#DC2626" stroke-width="2.5" fill="none" marker-end="url(#redArrow)"/>

  <!-- bottom strip -->
  <rect x="90" y="770" width="1420" height="60" rx="14" fill="#F1F5F9" stroke="#CBD5E1"/>
  <text x="114" y="806" class="f b">纪律：消息到达 ≠ 职权改变 · 确认先于获权 · 完成判据在账本事务序（commit 必然晚于同 transferId 的 ack）· 旧凭据新提交一律拒绝，仅已准入 effect 经认证 receipt 回流</text>
</svg>
