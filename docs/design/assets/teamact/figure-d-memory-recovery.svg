<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="860" viewBox="0 0 1600 860" role="img" aria-labelledby="title desc">
  <title id="title">安全续接需要什么持久下来</title>
  <desc id="desc">从"接手者能安全继续"反推出三类必须 durable 可获得的语义：责任/职权/进度真相、交接四要素（事实/意图/边界/行动）、高风险 effect 的准入与终态证据。它们存放于各域权威存储并以稳定 ID 互联（账本不是数据湖），新 holder 经多源重建恢复上下文，显式确认后才获权；无法确认则保持悬置。四层记忆划分是我们当前实现的一种非规范示例，不是范式内容。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F8FAFC"/><stop offset="1" stop-color="#EEF2FF"/></linearGradient>
    <filter id="s"><feDropShadow dx="0" dy="8" stdDeviation="11" flood-color="#1E293B" flood-opacity=".1"/></filter>
    <marker id="a" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M1,1 L10,5.5 L1,10 Z" fill="#64748B"/></marker>
    <style>.f{font-family:Inter,'Noto Sans CJK SC','PingFang SC',sans-serif}.h{fill:#172554;font-size:35px;font-weight:750}.s{fill:#64748B;font-size:18px}.t{fill:#172554;font-size:22px;font-weight:750}.c{fill:#475569;font-size:15px}.tag{font-size:13px;font-weight:750}.tiny{font-size:13px;fill:#64748B}</style>
  </defs>
  <rect width="1600" height="860" rx="32" fill="url(#bg)"/>
  <text x="80" y="85" class="f h">安全续接需要什么持久下来</text>
  <text x="80" y="119" class="f s">从"接手者能安全继续"反推——前任可能已不在场，这三类材料必须在它死后仍可获得</text>

  <!-- column 1: three durable semantic classes -->
  <g class="f" filter="url(#s)">
    <rect x="80" y="180" width="350" height="150" rx="22" fill="#FFFBEB" stroke="#FCD34D" stroke-width="2"/>
    <rect x="104" y="202" width="148" height="28" rx="14" fill="#FEF3C7"/><text x="122" y="222" class="tag" fill="#92400E">必须 durable ①</text>
    <text x="104" y="264" class="t">责任 · 职权 · 进度真相</text>
    <text x="104" y="293" class="c">Assignment envelope · Grant 版本</text>
    <text x="104" y="316" class="c">每次迁移落账，可回放</text>

    <rect x="80" y="352" width="350" height="150" rx="22" fill="#EFF6FF" stroke="#93C5FD" stroke-width="2"/>
    <rect x="104" y="374" width="148" height="28" rx="14" fill="#DBEAFE"/><text x="122" y="394" class="tag" fill="#1D4ED8">必须 durable ②</text>
    <text x="104" y="436" class="t">交接四要素</text>
    <text x="104" y="465" class="c">事实 · 意图 · 边界 · 行动</text>
    <text x="104" y="488" class="c">持久原文，或可回读的稳定引用</text>

    <rect x="80" y="524" width="350" height="150" rx="22" fill="#FDF2F8" stroke="#F9A8D4" stroke-width="2"/>
    <rect x="104" y="546" width="148" height="28" rx="14" fill="#FCE7F3"/><text x="122" y="566" class="tag" fill="#9D174D">必须 durable ③</text>
    <text x="104" y="608" class="t">高风险 effect 证据</text>
    <text x="104" y="637" class="c">准入记录 · 在途清单</text>
    <text x="104" y="660" class="c">可信终态回执（认证来源）</text>
  </g>

  <!-- arrows col1 -> col2 -->
  <g fill="none" stroke="#64748B" stroke-width="3" marker-end="url(#a)">
    <path d="M430 255 C480 255 500 360 546 400"/>
    <path d="M430 427 L546 427"/>
    <path d="M430 599 C480 599 500 494 546 454"/>
  </g>

  <!-- column 2: authoritative stores -->
  <g class="f" filter="url(#s)">
    <rect x="550" y="322" width="330" height="210" rx="22" fill="#fff" stroke="#CBD5E1" stroke-width="2"/>
    <rect x="574" y="344" width="120" height="28" rx="14" fill="#F1F5F9"/><text x="592" y="364" class="tag" fill="#475569">权威存储</text>
    <text x="574" y="406" class="t">各域权威存储</text>
    <text x="574" y="435" class="c">账本 · 版本库 · 会话存储 · 知识库</text>
    <text x="574" y="458" class="c">稳定 ID 互联</text>
    <text x="574" y="490" class="c" font-weight="700">账本不是共享数据湖</text>
  </g>

  <path d="M880 427 L946 427" fill="none" stroke="#64748B" stroke-width="3" marker-end="url(#a)"/>

  <!-- column 3: multi-source rebuild -->
  <g class="f" filter="url(#s)">
    <rect x="950" y="322" width="330" height="210" rx="22" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="2"/>
    <rect x="974" y="344" width="140" height="28" rx="14" fill="#EDE9FE"/><text x="992" y="364" class="tag" fill="#6D28D9">新 holder</text>
    <text x="974" y="406" class="t">多源重建</text>
    <text x="974" y="435" class="c">快照或检查点 + 账本回放</text>
    <text x="974" y="458" class="c">+ 知识检索 / 历史回读</text>
    <text x="974" y="490" class="c">崩溃时：manifest 从准入记录推导（④′）</text>
  </g>

  <path d="M1280 427 L1346 427" fill="none" stroke="#64748B" stroke-width="3" marker-end="url(#a)"/>

  <!-- column 4: recipient ack -->
  <g class="f" filter="url(#s)">
    <rect x="1350" y="322" width="170" height="210" rx="22" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="2"/>
    <rect x="1372" y="344" width="92" height="28" rx="14" fill="#D1FAE5"/><text x="1388" y="364" class="tag" fill="#047857">收口</text>
    <text x="1372" y="406" class="t">接收者确认</text>
    <text x="1372" y="435" class="c">显式 ack</text>
    <text x="1372" y="458" class="c">→ 才获权</text>
    <text x="1372" y="490" class="c">确认不了 →</text>
    <text x="1372" y="513" class="c">保持悬置</text>
  </g>

  <!-- footnote bar: non-normative implementation example -->
  <g class="f">
    <rect x="80" y="730" width="1440" height="66" rx="18" fill="#F1F5F9" stroke="#E2E8F0"/>
    <text x="110" y="758" class="tiny" font-weight="700">非规范实现注脚</text>
    <text x="110" y="780" class="tiny">我们当前的实现把这三类语义分放在四层存储（工作 / 团队 / 私有 / 责任记忆），以稳定 Actor 锚点跨 Run 关联——这是推导的一种实现示例，不是范式内容。</text>
  </g>
</svg>
