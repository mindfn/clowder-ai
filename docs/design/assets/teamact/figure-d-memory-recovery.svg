<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">TeamAct 记忆分层与重建路径</title>
  <desc id="desc">展示工作记忆、团队知识、私有记忆、责任记忆与 durable 检查点的分工，以及上下文读取和知识沉淀路径。会话更替后，新的 Run 通过交接快照或检查点、账本回放、知识检索和历史回读重建上下文。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F8FAFC"/><stop offset="1" stop-color="#EEF2FF"/></linearGradient>
    <filter id="s"><feDropShadow dx="0" dy="8" stdDeviation="11" flood-color="#1E293B" flood-opacity=".1"/></filter>
    <marker id="a" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M1,1 L10,5.5 L1,10 Z" fill="#64748B"/></marker>
    <marker id="blue" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M1,1 L10,5.5 L1,10 Z" fill="#2563EB"/></marker>
    <style>.f{font-family:Inter,'Noto Sans CJK SC','PingFang SC',sans-serif}.h{fill:#172554;font-size:35px;font-weight:750}.s{fill:#64748B;font-size:18px}.t{fill:#172554;font-size:23px;font-weight:750}.c{fill:#475569;font-size:16px}.tag{font-size:14px;font-weight:750;fill:#1E40AF}.tiny{font-size:14px;fill:#64748B}</style>
  </defs>
  <rect width="1600" height="980" rx="32" fill="url(#bg)"/>
  <text x="80" y="85" class="f h">记忆分层：让失忆不致命</text>
  <text x="80" y="119" class="f s">协作状态不能只存在于某次 session 的上下文里</text>

  <!-- arrows live behind cards so storage boundaries remain unambiguous -->
  <g fill="none" stroke="#2563EB" stroke-width="3" marker-end="url(#blue)">
    <path d="M525 276 C470 276 452 363 405 500"/>
    <path d="M525 480 C470 480 450 508 405 520"/>
    <path d="M405 650 C460 650 480 665 525 665"/>
  </g>

  <g class="f" filter="url(#s)">
    <rect x="83" y="190" width="322" height="550" rx="28" fill="#fff" stroke="#CBD5E1" stroke-width="2"/>
    <text x="117" y="240" class="tag">当前 RUN</text><text x="117" y="281" class="t">执行者的工作面</text>
    <rect x="116" y="325" width="256" height="104" rx="18" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="2"/><text x="140" y="364" class="t">工作记忆</text><text x="140" y="393" class="c">推理与中间状态</text><text x="140" y="418" class="tiny">随 Run 生灭 · 易失</text>
    <rect x="116" y="468" width="256" height="104" rx="18" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="2"/><text x="140" y="507" class="t">Orient</text><text x="140" y="536" class="c">契约 · 检查点 · 检索</text>
    <rect x="116" y="610" width="256" height="56" rx="18" fill="#FFF7ED" stroke="#FDBA74"/><text x="140" y="645" class="c">Commit：沉淀可复用结果</text>
  </g>

  <g class="f" filter="url(#s)">
    <rect x="525" y="184" width="415" height="175" rx="24" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="2"/><rect x="551" y="210" width="105" height="30" rx="15" fill="#D1FAE5"/><text x="573" y="231" class="tag" fill="#047857">共享 / 长期</text><text x="551" y="280" class="t">团队知识</text><text x="551" y="310" class="c">事实 · 决议 · 教训 · 规范</text><text x="551" y="338" class="tiny">可检索；Commit 的副产品</text>
    <rect x="525" y="390" width="415" height="175" rx="24" fill="#EFF6FF" stroke="#93C5FD" stroke-width="2"/><rect x="551" y="416" width="105" height="30" rx="15" fill="#DBEAFE"/><text x="573" y="437" class="tag">私有 / 长期</text><text x="551" y="486" class="t">私有记忆</text><text x="551" y="516" class="c">身份 · 关系 · 偏好 · 能力积累</text><text x="551" y="544" class="tiny">per-actor；影响行为但不共享</text>
    <rect x="525" y="615" width="415" height="100" rx="24" fill="#FDF2F8" stroke="#F9A8D4" stroke-width="2"/><rect x="551" y="638" width="156" height="28" rx="14" fill="#FCE7F3"/><text x="570" y="658" class="tag" fill="#9D174D">durable 检查点</text><text x="551" y="690" class="c">进度 · 未观测 effect · 下一恢复点</text>
  </g>

  <g class="f" filter="url(#s)">
    <rect x="1055" y="184" width="462" height="411" rx="24" fill="#FFFBEB" stroke="#FCD34D" stroke-width="2"/><rect x="1081" y="210" width="130" height="30" rx="15" fill="#FEF3C7"/><text x="1101" y="231" class="tag" fill="#92400E">权威 / 追加写</text><text x="1081" y="280" class="t">责任记忆 · 协调账本</text><text x="1081" y="310" class="c">谁在何时对什么负责、谁被允许行动</text><line x1="1081" y1="340" x2="1487" y2="340" stroke="#FDE68A" stroke-width="2"/><text x="1081" y="380" class="c">• ResponsibilityAssignment</text><text x="1081" y="415" class="c">• AuthorityGrant / Run / heartbeat</text><text x="1081" y="450" class="c">• Handoff / Outcome / effect 准入</text><text x="1081" y="507" class="tiny">append-only；与知识以稳定 ID 相互引用</text>
  </g>

  <!-- durable reads/writes use the clear corridors and terminate at their semantic target -->
  <path d="M372 638 C460 638 470 322 525 322" fill="none" stroke="#0F766E" stroke-width="3" marker-end="url(#blue)"/>
  <path d="M1055 315 C980 120 700 105 485 160 C430 250 410 460 360 520" fill="none" stroke="#2563EB" stroke-width="3" marker-end="url(#blue)"/>

  <g class="f">
    <rect x="427" y="350" width="100" height="30" rx="15" fill="#DBEAFE"/><text x="447" y="371" class="tag">Orient 检索</text>
    <rect x="429" y="604" width="103" height="30" rx="15" fill="#DBEAFE"/><text x="447" y="625" class="tag">Commit 沉淀</text>
    <rect x="760" y="141" width="160" height="30" rx="15" fill="#FEF3C7"/><text x="780" y="162" class="tag" fill="#92400E">账本回放 → Orient</text>
    <text x="438" y="686" class="tag" fill="#9D174D">关键点落地</text>
  </g>

  <path d="M244 742v38" fill="none" stroke="#E11D48" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#a)"/><text x="119" y="765" class="f" fill="#BE123C" font-size="16" font-weight="700">会话结束 / 压缩</text>
  <g class="f" filter="url(#s)">
    <rect x="83" y="805" width="1434" height="112" rx="24" fill="#172554"/>
    <text x="116" y="842" font-size="17" fill="#BFDBFE" font-weight="750">下一次 Run 的三源重建</text>
    <g transform="translate(392 824)"><rect width="270" height="66" rx="16" fill="#243B68"/><text x="24" y="29" font-size="15" fill="#fff" font-weight="700">① 契约 / durable 检查点</text><text x="24" y="51" font-size="14" fill="#CBD5E1">意图 · 进度 · 边界</text></g>
    <text x="684" y="865" font-size="26" fill="#93C5FD">+</text>
    <g transform="translate(716 824)"><rect width="220" height="66" rx="16" fill="#243B68"/><text x="24" y="29" font-size="15" fill="#fff" font-weight="700">② 账本回放</text><text x="24" y="51" font-size="14" fill="#CBD5E1">责任状态</text></g>
    <text x="958" y="865" font-size="26" fill="#93C5FD">+</text>
    <g transform="translate(990 824)"><rect width="250" height="66" rx="16" fill="#243B68"/><text x="24" y="29" font-size="15" fill="#fff" font-weight="700">③ 知识检索 / 回读</text><text x="24" y="51" font-size="14" fill="#CBD5E1">细节与背景</text></g>
    <path d="M1255 857h72" stroke="#93C5FD" stroke-width="3" marker-end="url(#blue)"/><text x="1344" y="864" font-size="18" fill="#fff" font-weight="700">Orient</text>
  </g>
</svg>
