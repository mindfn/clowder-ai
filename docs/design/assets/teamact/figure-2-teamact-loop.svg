<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">TeamAct 协作回合</title>
  <desc id="desc">一个八步循环。入口既可以由定向 push 投递 offer 或 envelope 并主动触发，也可以由执行者从共享状态 pull 发现工作；随后依次经过 Inspect、Acquire 或 Validate Claim、Orient、Execute、Verify、Commit、Transition。Execute 内含一个单 agent 的 ReAct 工具循环；Transition 的出口可以进入下一回合、独立验证工作单元或人类关口。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F8FBFF"/><stop offset="1" stop-color="#F5F3FF"/></linearGradient>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#334155" flood-opacity=".12"/></filter>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#64748B"/></marker>
    <marker id="b" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#2563EB"/></marker>
    <style>.f{font-family:Inter,'Noto Sans CJK SC','PingFang SC',sans-serif}.h{fill:#172554;font-size:35px;font-weight:750}.s{fill:#64748B;font-size:18px}.step{fill:#172554;font-size:19px;font-weight:750}.step-sm{fill:#172554;font-size:17px;font-weight:750}.num{fill:#fff;font-size:15px;font-weight:750}.copy{fill:#475569;font-size:15px}.tag{fill:#1D4ED8;font-size:14px;font-weight:700}</style>
  </defs>
  <rect width="1600" height="980" rx="32" fill="url(#bg)"/>
  <text x="80" y="85" class="f h">TeamAct 协作回合</text>
  <text x="80" y="119" class="f s">入口可由定向 push 主动触发，也可从共享状态 pull 发现；责任语义始终相同</text>

  <g class="f">
    <rect x="95" y="198" width="250" height="82" rx="18" fill="#E0F2FE" stroke="#7DD3FC" stroke-width="2"/><text x="125" y="230" class="tag">PUSH · 主动调度</text><text x="125" y="257" class="copy">定向 offer / envelope → 触发</text>
    <rect x="95" y="303" width="250" height="82" rx="18" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="2"/><text x="125" y="335" class="tag" fill="#047857">PULL · 共享状态</text><text x="125" y="362" class="copy">工作池发现 → CAS 认领</text>
  </g>
  <path d="M345 239 C396 239 420 270 450 297" fill="none" stroke="#2563EB" stroke-width="3" marker-end="url(#b)"/>
  <path d="M345 344 C393 344 414 333 450 323" fill="none" stroke="#0F766E" stroke-width="3" marker-end="url(#b)"/>

  <!-- eight-step loop, kept behind the cards -->
  <g fill="none" stroke="#94A3B8" stroke-width="3" marker-end="url(#a)">
    <path d="M620 292 C653 248 670 230 700 225"/>
    <path d="M865 225 C890 226 898 258 915 276"/>
    <path d="M1100 336 C1184 355 1218 388 1217 430"/>
    <path d="M1217 528 C1200 575 1145 617 1115 646"/>
    <path d="M955 723 C920 753 882 752 855 744"/>
    <path d="M690 760 C638 756 625 710 615 690"/>
    <path d="M445 680 C379 639 346 554 360 528"/>
    <path d="M420 430 C430 370 440 335 470 343"/>
  </g>

  <g class="f" filter="url(#sh)">
    <g transform="translate(450 245)"><rect width="170" height="98" rx="20" fill="#DBEAFE" stroke="#60A5FA" stroke-width="2"/><circle cx="29" cy="28" r="16" fill="#2563EB"/><text x="24" y="33" class="num">1</text><text x="55" y="33" class="step">Wake</text><text x="55" y="56" class="copy">/ Discover</text><text x="22" y="82" class="copy">进入回合</text></g>
    <g transform="translate(700 175)"><rect width="165" height="98" rx="20" fill="#E0E7FF" stroke="#818CF8" stroke-width="2"/><circle cx="29" cy="28" r="16" fill="#4F46E5"/><text x="24" y="33" class="num">2</text><text x="55" y="34" class="step">Inspect</text><text x="22" y="82" class="copy">浅评估边界</text></g>
    <g transform="translate(915 230)"><rect width="250" height="106" rx="20" fill="#EDE9FE" stroke="#A78BFA" stroke-width="2"/><circle cx="29" cy="28" r="16" fill="#7C3AED"/><text x="24" y="33" class="num">3</text><text x="55" y="33" class="step-sm">Acquire / Validate</text><text x="55" y="56" class="step-sm">Claim</text><text x="22" y="89" class="copy">首次 · 原 holder 续接 · transfer</text></g>
    <g transform="translate(1125 430)"><rect width="185" height="98" rx="20" fill="#F3E8FF" stroke="#C084FC" stroke-width="2"/><circle cx="29" cy="28" r="16" fill="#9333EA"/><text x="24" y="33" class="num">4</text><text x="55" y="34" class="step">Orient</text><text x="22" y="82" class="copy">契约 · 检查点 · 检索</text></g>
    <g transform="translate(930 625)"><rect width="185" height="98" rx="20" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="2"/><circle cx="29" cy="28" r="16" fill="#DB2777"/><text x="24" y="33" class="num">5</text><text x="55" y="34" class="step">Execute</text><text x="22" y="82" class="copy">实际执行</text></g>
    <g transform="translate(690 710)"><rect width="165" height="98" rx="20" fill="#FFF7ED" stroke="#FDBA74" stroke-width="2"/><circle cx="29" cy="28" r="16" fill="#EA580C"/><text x="24" y="33" class="num">6</text><text x="55" y="34" class="step">Verify</text><text x="22" y="82" class="copy">自验门禁</text></g>
    <g transform="translate(445 630)"><rect width="170" height="98" rx="20" fill="#FEF3C7" stroke="#FCD34D" stroke-width="2"/><circle cx="29" cy="28" r="16" fill="#D97706"/><text x="24" y="33" class="num">7</text><text x="55" y="34" class="step">Commit</text><text x="22" y="82" class="copy">产出 + 落账</text></g>
    <g transform="translate(330 430)"><rect width="180" height="98" rx="20" fill="#DCFCE7" stroke="#86EFAC" stroke-width="2"/><circle cx="29" cy="28" r="16" fill="#16A34A"/><text x="24" y="33" class="num">8</text><text x="55" y="34" class="step">Transition</text><text x="22" y="82" class="copy">显式选择出口</text></g>
  </g>

  <!-- ReAct lives beside Execute, never on top of it -->
  <g class="f"><path d="M1115 674 C1142 674 1155 690 1175 695" fill="none" stroke="#DB2777" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#b)"/><circle cx="1260" cy="700" r="78" fill="#fff" stroke="#F472B6" stroke-width="2" stroke-dasharray="6 5"/><text x="1222" y="686" class="tag" fill="#BE185D">单 agent 内循环</text><text x="1230" y="711" class="copy">思考 · 工具</text><text x="1236" y="735" class="copy">观察 · 调整</text><path d="M1207 746c-18-27-12-61 12-77" fill="none" stroke="#DB2777" stroke-width="2" marker-end="url(#b)"/></g>

  <!-- Transition exits run outside the loop -->
  <path d="M350 528 C245 620 166 725 225 850" fill="none" stroke="#16A34A" stroke-width="3" marker-end="url(#b)"/>
  <g class="f" filter="url(#sh)"><rect x="100" y="850" width="620" height="72" rx="19" fill="#172554"/><text x="130" y="880" font-size="16" fill="#93C5FD" font-weight="750">Transition 的合法出口</text><text x="130" y="905" font-size="16" fill="#fff">下一回合 · 独立 verify WorkUnit · HumanGate</text></g>
  <g class="f"><rect x="780" y="850" width="720" height="72" rx="19" fill="#172554"/><text x="810" y="895" font-size="18" fill="#fff" font-weight="650">模式是策略，责任结构是不变量：认领排他、义务明确、职责连续性可监测。</text></g>
</svg>
