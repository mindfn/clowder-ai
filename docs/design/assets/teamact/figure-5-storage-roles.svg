<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">协调账本与各域权威存储的分工</title><desc id="desc">协调账本是责任迁移事件的追加写记录；消息、产物、共享状态和团队知识各有权威存储。它们以稳定 ID 互相引用，并投影出因果树、执行泳道和责任归属等可重建读模型。</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F8FAFC"/><stop offset="1" stop-color="#EFF6FF"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#1E293B" flood-opacity=".1"/></filter><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#64748B"/></marker><style>.f{font-family:Inter,'Noto Sans CJK SC','PingFang SC',sans-serif}.h{fill:#172554;font-size:35px;font-weight:750}.sub{fill:#64748B;font-size:18px}.t{fill:#172554;font-size:22px;font-weight:750}.c{fill:#475569;font-size:16px}.tag{fill:#1E40AF;font-size:14px;font-weight:750}</style></defs>
  <rect width="1600" height="900" rx="32" fill="url(#bg)"/><text x="80" y="84" class="f h">账本不是万能存储：它记录责任，内容各归其主</text><text x="80" y="118" class="f sub">逻辑单一的协调历史 + 分域权威存储 + 可重建读模型</text>
  <!-- authority stores -->
  <g class="f" filter="url(#s)"><g transform="translate(100 205)"><rect width="300" height="136" rx="22" fill="#E0F2FE" stroke="#7DD3FC" stroke-width="2"/><text x="31" y="53" class="t">消息存储</text><text x="31" y="84" class="c">内容、线程、原始历史</text><text x="31" y="112" class="tag">权威：说了什么</text></g><g transform="translate(1200 205)"><rect width="300" height="136" rx="22" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="2"/><text x="31" y="53" class="t">产物存储</text><text x="31" y="84" class="c">代码、文档、版本、摘要</text><text x="31" y="112" class="tag" fill="#9D174D">权威：做出了什么</text></g><g transform="translate(100 465)"><rect width="300" height="136" rx="22" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="2"/><text x="31" y="53" class="t">共享状态</text><text x="31" y="84" class="c">任务、配置、业务对象</text><text x="31" y="112" class="tag" fill="#047857">权威：现在是什么</text></g><g transform="translate(1200 465)"><rect width="300" height="136" rx="22" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="2"/><text x="31" y="53" class="t">团队知识</text><text x="31" y="84" class="c">事实、决议、教训、规范</text><text x="31" y="112" class="tag" fill="#5B21B6">权威：团队知道什么</text></g></g>
  <!-- ledger -->
  <g class="f" filter="url(#s)"><rect x="525" y="235" width="550" height="355" rx="30" fill="#172554"/><text x="570" y="291" font-size="16" fill="#93C5FD" font-weight="750">APPEND-ONLY · COORDINATION LEDGER</text><text x="570" y="344" font-size="30" fill="#fff" font-weight="750">协调账本</text><text x="570" y="381" font-size="17" fill="#CBD5E1">只记录责任迁移事件，不复制内容</text><g transform="translate(570 423)"><rect width="455" height="42" rx="12" fill="#243B68"/><text x="20" y="28" font-size="15" fill="#E2E8F0">WorkUnit · Offer · Claim · Attempt</text><rect y="54" width="455" height="42" rx="12" fill="#243B68"/><text x="20" y="82" font-size="15" fill="#E2E8F0">心跳 · Transition · effect 准入 · Outcome 坐标</text></g><text x="570" y="555" font-size="15" fill="#93C5FD">以稳定 ID 引用各域；不宣称跨域原子写入</text></g>
  <!-- reference lines -->
  <g fill="none" stroke="#64748B" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#a)"><path d="M400 273 C459 273 468 315 525 335"/><path d="M1200 273 C1141 273 1133 315 1075 335"/><path d="M400 533 C459 533 468 502 525 486"/><path d="M1200 533 C1141 533 1133 502 1075 486"/></g><g class="f"><text x="434" y="297" class="tag">稳定 ID</text><text x="1110" y="297" class="tag">稳定 ID</text><text x="434" y="520" class="tag">稳定 ID</text><text x="1110" y="520" class="tag">稳定 ID</text></g>
  <!-- projections -->
  <text x="80" y="687" class="f t">可重建的读模型（不是新的权威）</text><g class="f" filter="url(#s)"><g transform="translate(355 725)"><rect width="245" height="104" rx="20" fill="#fff" stroke="#BFDBFE" stroke-width="2"/><text x="27" y="43" class="t">因果树</text><text x="27" y="73" class="c">理解依赖与分支</text></g><g transform="translate(680 725)"><rect width="245" height="104" rx="20" fill="#fff" stroke="#BFDBFE" stroke-width="2"/><text x="27" y="43" class="t">执行泳道</text><text x="27" y="73" class="c">追踪 attempts</text></g><g transform="translate(1005 725)"><rect width="245" height="104" rx="20" fill="#fff" stroke="#BFDBFE" stroke-width="2"/><text x="27" y="43" class="t">责任归属</text><text x="27" y="73" class="c">审计谁负责什么</text></g></g><g fill="none" stroke="#2563EB" stroke-width="3" marker-end="url(#a)"><path d="M650 590 C650 653 485 679 485 725"/><path d="M800 590v116"/><path d="M950 590 C950 653 1127 679 1127 725"/></g>
</svg>
