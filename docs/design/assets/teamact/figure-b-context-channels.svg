<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">TeamAct 三步责任循环与上下文双通道</title>
  <desc id="desc">规范循环由 Bind、Act、Handoff 或 Resolve 三步组成。Handoff 提交后以新 envelope 版本回到 Bind（transfer-pending 期不递增，commit 才 v+1），Resolve 进入不可复活终态；Bind 之前的 offer 窗口由 dispositionActor 处置。交接快照主动推送事实、意图、边界、行动与在途副作用；接收者从账本、历史和团队知识按需拉取细节。两条通道共同满足计划性交接的 ContextReady 门槛（崩溃恢复走 ④′ 的退化形态），suspend 是循环外治理中断。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F8FAFC"/><stop offset="1" stop-color="#F5F3FF"/></linearGradient>
    <filter id="s" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#1E293B" flood-opacity=".1"/></filter>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M1 1L10 5.5L1 10Z" fill="#64748B"/></marker>
    <marker id="blue" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M1 1L10 5.5L1 10Z" fill="#2563EB"/></marker>
    <marker id="green" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M1 1L10 5.5L1 10Z" fill="#059669"/></marker>
    <style>
      .f{font-family:Inter,'Noto Sans CJK SC','PingFang SC',sans-serif}
      .h{fill:#172554;font-size:36px;font-weight:760}.sub{fill:#64748B;font-size:18px}
      .step{fill:#172554;font-size:24px;font-weight:760}.copy{fill:#475569;font-size:16px}
      .tag{font-size:14px;font-weight:750}.small{fill:#475569;font-size:14px}
    </style>
  </defs>
  <rect width="1600" height="900" rx="32" fill="url(#bg)"/>
  <text x="80" y="84" class="f h">责任循环三步，上下文走双通道</text>
  <text x="80" y="118" class="f sub">push 传窄而有意图的快照；pull 回读细节；两者共同满足计划性交接的 ContextReady 门槛（崩溃恢复见 ④′）</text>

  <g class="f" filter="url(#s)">
    <rect x="80" y="168" width="690" height="622" rx="30" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <rect x="110" y="196" width="154" height="32" rx="16" fill="#EDE9FE"/>
    <text x="132" y="218" class="tag" fill="#6D28D9">规范责任循环</text>

    <g transform="translate(150 270)">
      <rect width="240" height="150" rx="23" fill="#EFF6FF" stroke="#93C5FD" stroke-width="2"/>
      <circle cx="34" cy="34" r="18" fill="#2563EB"/><text x="28" y="40" font-size="17" font-weight="750" fill="#fff">1</text>
      <text x="68" y="42" class="step">Bind</text>
      <text x="24" y="78" class="copy">envelope：assigned(v)</text>
      <text x="24" y="104" class="copy">per-scope AuthorityGrant</text>
      <text x="24" y="130" class="copy" font-size="13">此前 offer 窗口：dispositionActor 处置</text>
    </g>

    <g transform="translate(455 270)">
      <rect width="240" height="126" rx="23" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="2"/>
      <circle cx="34" cy="34" r="18" fill="#059669"/><text x="28" y="40" font-size="17" font-weight="750" fill="#fff">2</text>
      <text x="68" y="42" class="step">Act</text>
      <text x="24" y="78" class="copy">Run(n) · heartbeat</text>
      <text x="24" y="104" class="copy">checkpoint · side effects</text>
    </g>

    <g transform="translate(150 520)">
      <rect width="260" height="150" rx="23" fill="#FFF7ED" stroke="#FDBA74" stroke-width="2"/>
      <circle cx="34" cy="34" r="18" fill="#EA580C"/><text x="24" y="39" font-size="14" font-weight="750" fill="#fff">3a</text>
      <text x="68" y="42" class="step">Handoff</text>
      <text x="24" y="80" class="copy">prepare → ack → commit</text>
      <text x="24" y="106" class="copy" font-size="14">commit 才 v+1（pending 期不递增）</text>
      <text x="24" y="132" class="copy">→ Bind(v+1)</text>
    </g>

    <g transform="translate(455 520)">
      <rect width="240" height="150" rx="23" fill="#FFF1F2" stroke="#FDA4AF" stroke-width="2"/>
      <circle cx="34" cy="34" r="18" fill="#E11D48"/><text x="24" y="39" font-size="14" font-weight="750" fill="#fff">3b</text>
      <text x="68" y="42" class="step">Resolve</text>
      <text x="24" y="80" class="copy">validation passed</text>
      <text x="24" y="106" class="copy">Assignment → resolved</text>
      <text x="24" y="132" class="copy">terminal · no re-entry</text>
    </g>

    <path d="M390 333h55" fill="none" stroke="#64748B" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M575 396V458H280V512" fill="none" stroke="#64748B" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M575 458V512" fill="none" stroke="#64748B" stroke-width="3" marker-end="url(#arrow)"/>
    <circle cx="575" cy="458" r="6" fill="#64748B"/>
    <path d="M150 595C105 595 100 455 155 403" fill="none" stroke="#EA580C" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M545 690h60" fill="none" stroke="#E11D48" stroke-width="5" stroke-linecap="round"/>

    <g transform="translate(110 706)">
      <rect width="610" height="54" rx="17" fill="#172554"/>
      <text x="24" y="34" font-size="15" font-weight="700" fill="#BFDBFE">循环外治理中断：</text>
      <text x="184" y="34" font-size="15" fill="#fff">suspend 将责任与行动性职权置入显式安全处置态</text>
    </g>
  </g>

  <g class="f" filter="url(#s)">
    <rect x="850" y="168" width="670" height="238" rx="28" fill="#EFF6FF" stroke="#93C5FD" stroke-width="2"/>
    <rect x="880" y="196" width="210" height="32" rx="16" fill="#DBEAFE"/>
    <text x="902" y="218" class="tag" fill="#1D4ED8">PUSH · 交接快照</text>
    <text x="880" y="270" class="step">窄而结构化：保留意图</text>
    <g transform="translate(880 302)">
      <rect width="118" height="58" rx="15" fill="#fff" stroke="#BFDBFE"/><text x="42" y="35" class="tag" fill="#1E3A8A">事实</text>
      <rect x="132" width="118" height="58" rx="15" fill="#fff" stroke="#BFDBFE"/><text x="174" y="35" class="tag" fill="#1E3A8A">意图</text>
      <rect x="264" width="118" height="58" rx="15" fill="#fff" stroke="#BFDBFE"/><text x="306" y="35" class="tag" fill="#1E3A8A">边界</text>
      <rect x="396" width="118" height="58" rx="15" fill="#fff" stroke="#BFDBFE"/><text x="438" y="35" class="tag" fill="#1E3A8A">行动</text>
    </g>
    <text x="880" y="390" class="small">+ 在途副作用清单（in-flight effects manifest）</text>
  </g>

  <g class="f" filter="url(#s)">
    <rect x="850" y="448" width="670" height="220" rx="28" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="2"/>
    <rect x="880" y="476" width="208" height="32" rx="16" fill="#D1FAE5"/>
    <text x="902" y="498" class="tag" fill="#047857">PULL · 按需回读</text>
    <text x="880" y="550" class="step">宽而可检索：找回细节</text>
    <g transform="translate(880 580)">
      <rect width="185" height="54" rx="15" fill="#fff" stroke="#A7F3D0"/><text x="46" y="33" class="tag" fill="#065F46">账本回放</text>
      <rect x="202" width="185" height="54" rx="15" fill="#fff" stroke="#A7F3D0"/><text x="248" y="33" class="tag" fill="#065F46">原始历史</text>
      <rect x="404" width="185" height="54" rx="15" fill="#fff" stroke="#A7F3D0"/><text x="450" y="33" class="tag" fill="#065F46">团队知识</text>
    </g>
  </g>

  <g class="f" filter="url(#s)">
    <rect x="910" y="724" width="550" height="88" rx="24" fill="#172554"/>
    <text x="1185" y="758" text-anchor="middle" font-size="18" font-weight="750" fill="#fff">ContextReady(requiredContextVersion, digest)</text>
    <text x="1185" y="788" text-anchor="middle" font-size="15" fill="#BFDBFE">计划性交接 commit 与继任者安全行动的共同前置条件</text>
  </g>
  <path d="M1450 406H1550V768H1468" fill="none" stroke="#2563EB" stroke-width="3" marker-end="url(#blue)"/>
  <path d="M1185 668v48" fill="none" stroke="#059669" stroke-width="3" marker-end="url(#green)"/>
  <path d="M910 768C820 768 760 620 690 396" fill="none" stroke="#7C3AED" stroke-width="3" marker-end="url(#arrow)"/>
</svg>
