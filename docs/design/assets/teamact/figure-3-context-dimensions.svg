<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="850" viewBox="0 0 1600 850" role="img" aria-labelledby="title desc">
  <title id="title">wake、obligation 与 readability 三维分离</title><desc id="desc">一条协作消息进入协作域后，分别决定谁被唤醒、谁背负处理义务以及谁可以回读。义务和唤醒范围很窄，可读范围独立且较宽。</desc>
  <defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#F8FAFC"/><stop offset="1" stop-color="#F5F3FF"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="7" stdDeviation="10" flood-opacity=".1"/></filter><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#64748B"/></marker><style>.f{font-family:Inter,'Noto Sans CJK SC','PingFang SC',sans-serif}.h{fill:#172554;font-size:35px;font-weight:750}.sub{fill:#64748B;font-size:18px}.t{fill:#172554;font-size:22px;font-weight:750}.c{fill:#475569;font-size:16px}.l{fill:#1E40AF;font-size:15px;font-weight:700}</style></defs>
  <rect width="1600" height="850" rx="32" fill="url(#bg)"/><text x="80" y="85" class="f h">消息的三维分离</text><text x="80" y="119" class="f sub">唤醒、义务与可读性是独立的决定；一个“已投递”状态无法代表三者</text>
  <g class="f" filter="url(#s)"><rect x="83" y="323" width="270" height="178" rx="24" fill="#EDE9FE" stroke="#A78BFA" stroke-width="2"/><path d="M123 374h47m-47 27h102m-102 27h79" stroke="#7C3AED" stroke-width="6" stroke-linecap="round"/><text x="123" y="452" class="t">协作消息</text><text x="123" y="480" class="c">内容 + 稳定 ID</text></g>
  <path d="M353 376 C430 253 480 234 570 236" fill="none" stroke="#2563EB" stroke-width="3" marker-end="url(#a)"/><path d="M353 413 C440 413 474 413 570 413" fill="none" stroke="#D97706" stroke-width="3" marker-end="url(#a)"/><path d="M353 449 C430 575 490 596 570 596" fill="none" stroke="#0F766E" stroke-width="3" marker-end="url(#a)"/>
  <!-- wake -->
  <g class="f" filter="url(#s)"><rect x="570" y="135" width="870" height="184" rx="24" fill="#EFF6FF" stroke="#93C5FD" stroke-width="2"/><rect x="598" y="163" width="115" height="33" rx="16" fill="#DBEAFE"/><text x="621" y="186" class="l">WAKE</text><text x="598" y="236" class="t">谁被这条消息唤醒？</text><text x="598" y="267" class="c">按路由策略显式定向。范围窄：只通知需要进入一个新回合的执行者。</text><g transform="translate(1094 182)"><circle cx="38" cy="40" r="29" fill="#2563EB"/><text x="29" y="47" font-size="23" fill="#fff">A</text><circle cx="132" cy="40" r="29" fill="#E2E8F0"/><text x="123" y="47" font-size="23" fill="#64748B">B</text><circle cx="226" cy="40" r="29" fill="#E2E8F0"/><text x="217" y="47" font-size="23" fill="#64748B">C</text><text x="16" y="93" class="c">仅 A 被唤醒</text></g></g>
  <!-- obligation -->
  <g class="f" filter="url(#s)"><rect x="570" y="343" width="870" height="184" rx="24" fill="#FFF7ED" stroke="#FDBA74" stroke-width="2"/><rect x="598" y="371" width="142" height="33" rx="16" fill="#FFEDD5"/><text x="616" y="394" class="l" fill="#9A3412">OBLIGATION</text><text x="598" y="444" class="t">处理义务算谁的？</text><text x="598" y="475" class="c">只归属于我的义务，才进入工作上下文与门禁。</text><g transform="translate(1094 390)"><circle cx="38" cy="40" r="29" fill="#D97706"/><text x="29" y="47" font-size="23" fill="#fff">A</text><circle cx="132" cy="40" r="29" fill="#E2E8F0"/><text x="123" y="47" font-size="23" fill="#64748B">B</text><circle cx="226" cy="40" r="29" fill="#E2E8F0"/><text x="217" y="47" font-size="23" fill="#64748B">C</text><text x="3" y="93" class="c">仅 A 背负义务</text></g></g>
  <!-- readability -->
  <g class="f" filter="url(#s)"><rect x="570" y="551" width="870" height="184" rx="24" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="2"/><rect x="598" y="579" width="153" height="33" rx="16" fill="#D1FAE5"/><text x="616" y="602" class="l" fill="#047857">READABILITY</text><text x="598" y="652" class="t">谁能主动回读？</text><text x="598" y="683" class="c">独立 ACL 决定；协作域默认可读，可按需回读。</text><g transform="translate(1094 598)"><circle cx="38" cy="40" r="29" fill="#0F766E"/><text x="29" y="47" font-size="23" fill="#fff">A</text><circle cx="132" cy="40" r="29" fill="#0F766E"/><text x="123" y="47" font-size="23" fill="#fff">B</text><circle cx="226" cy="40" r="29" fill="#0F766E"/><text x="217" y="47" font-size="23" fill="#fff">C</text><text x="-8" y="93" class="c">A / B / C 均可回读</text></g></g>
  <rect x="83" y="770" width="1357" height="48" rx="15" fill="#172554"/><text x="111" y="802" class="f" font-size="18" fill="#fff" font-weight="650">隔离注意力与义务，不隔离信息：投递状态不决定阅读权限。</text>
</svg>
