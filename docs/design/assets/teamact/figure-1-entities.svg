<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">TeamAct 实体关系</title>
  <desc id="desc">以工作单元为中心，展示 Offer、Claim、Attempt、Outcome、Transition 与 Actor 的关系，以及父子工作单元的 split 与 join。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F8FBFF"/><stop offset="1" stop-color="#F4F1FF"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1E293B" flood-opacity=".10"/></filter>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M1,1 L10,5.5 L1,10 Z" fill="#64748B"/></marker>
    <marker id="blueArrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M1,1 L10,5.5 L1,10 Z" fill="#2563EB"/></marker>
    <style>
      .t{font-family:Inter,'Noto Sans CJK SC','PingFang SC',sans-serif;fill:#172554}.k{font-family:Inter,'Noto Sans CJK SC','PingFang SC',sans-serif;fill:#475569}.title{font-size:35px;font-weight:750}.sub{font-size:18px;fill:#64748B}.node{filter:url(#shadow)}.n-title{font-family:Inter,'Noto Sans CJK SC','PingFang SC',sans-serif;font-size:23px;font-weight:750;fill:#172554}.n-copy{font-family:Inter,'Noto Sans CJK SC','PingFang SC',sans-serif;font-size:16px;fill:#475569}.edge{font-family:Inter,'Noto Sans CJK SC','PingFang SC',sans-serif;font-size:15px;font-weight:650;fill:#475569}.pill{font-family:Inter,'Noto Sans CJK SC','PingFang SC',sans-serif;font-size:14px;font-weight:650;fill:#1E40AF}
    </style>
  </defs>
  <rect width="1600" height="900" rx="32" fill="url(#bg)"/>
  <text x="82" y="88" class="title t">TeamAct 的六个协调实体</text>
  <text x="82" y="122" class="sub t">责任不是一句消息，而是一组可追溯、可迁移的关系</text>
  <g stroke="#CBD5E1" stroke-width="2.5" fill="none" marker-end="url(#arrow)">
    <path d="M580 462 C520 514 404 560 330 603"/>
    <path d="M330 640 C518 758 804 740 921 432"/>
    <path d="M1054 434 C1064 486 1048 522 1028 554"/>
    <path d="M1038 630 C1115 630 1168 620 1230 605"/>
    <path d="M650 548 C650 515 660 488 673 462"/>
  </g>
  <g stroke="#0EA5E9" stroke-width="2.5" stroke-dasharray="7 6" fill="none">
    <path d="M355 285 C515 180 825 180 1000 276"/>
    <path d="M230 394 C204 470 207 521 207 570"/>
  </g>
  <g class="edge"><text x="390" y="529">创建 Offer · 1:N</text><text x="551" y="742">候选中标 · 1:1</text><text x="1062" y="495">启动 / 续接</text><text x="1124" y="612">产出</text><text x="672" y="510">类型化迁移</text><text x="595" y="198" fill="#0284C7">profile 约束</text><text x="92" y="490" fill="#0284C7">候选执行者</text></g>
  <!-- actor -->
  <g class="node">
    <rect x="82" y="240" width="273" height="154" rx="22" fill="#E0F2FE" stroke="#7DD3FC" stroke-width="2"/>
    <circle cx="124" cy="287" r="20" fill="#0EA5E9"/><path d="M113 292c4-10 18-10 22 0m-16-12a6 6 0 1 0 0-.1" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    <text x="158" y="286" class="n-title">Actor</text><text x="158" y="314" class="n-copy">身份 + profile</text>
    <rect x="108" y="336" width="65" height="27" rx="13" fill="#BAE6FD"/><text x="121" y="355" class="pill">能力</text>
    <rect x="184" y="336" width="65" height="27" rx="13" fill="#BAE6FD"/><text x="197" y="355" class="pill">关系</text>
    <rect x="260" y="336" width="65" height="27" rx="13" fill="#BAE6FD"/><text x="273" y="355" class="pill">权限</text>
  </g>
  <!-- work unit -->
  <g class="node">
    <rect x="496" y="251" width="297" height="211" rx="24" fill="#EDE9FE" stroke="#A78BFA" stroke-width="2.5"/>
    <rect x="521" y="275" width="104" height="31" rx="15" fill="#DDD6FE"/><text x="541" y="297" class="pill" fill="#5B21B6">责任中心</text>
    <text x="521" y="348" class="n-title">WorkUnit</text><text x="521" y="378" class="n-copy">独立生命周期、重试与验证边界</text>
    <line x1="521" y1="401" x2="768" y2="401" stroke="#C4B5FD"/>
    <text x="521" y="430" class="n-copy">输入 · 验收契约 · 预算 / 权限</text>
  </g>
  <!-- offer -->
  <g class="node"><rect x="82" y="570" width="248" height="138" rx="22" fill="#EFF6FF" stroke="#93C5FD" stroke-width="2"/><text x="112" y="620" class="n-title">Offer</text><text x="112" y="648" class="n-copy">定向或广播</text><text x="112" y="678" class="n-copy">可撤回、可过期</text></g>
  <!-- claim -->
  <g class="node"><rect x="922" y="276" width="267" height="158" rx="22" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="2"/><text x="952" y="325" class="n-title">Claim</text><text x="952" y="354" class="n-copy">CAS 建立的排他认领</text><text x="952" y="385" class="n-copy">lease · generation</text></g>
  <!-- attempt -->
  <g class="node"><rect x="760" y="554" width="278" height="154" rx="22" fill="#FFF7ED" stroke="#FDBA74" stroke-width="2"/><text x="790" y="605" class="n-title">Attempt</text><text x="790" y="634" class="n-copy">一次 session / invocation</text><text x="790" y="665" class="n-copy">started → heartbeat → 终态</text></g>
  <!-- outcome -->
  <g class="node"><rect x="1230" y="524" width="286" height="143" rx="22" fill="#FDF2F8" stroke="#F9A8D4" stroke-width="2"/><text x="1260" y="576" class="n-title">Outcome</text><text x="1260" y="605" class="n-copy">不可变产出坐标</text><text x="1260" y="635" class="n-copy">版本链 · 独立验证绑定</text></g>
  <!-- transition -->
  <g class="node"><rect x="556" y="548" width="186" height="125" rx="22" fill="#FFFBEB" stroke="#FCD34D" stroke-width="2"/><text x="584" y="594" class="n-title">Transition</text><text x="584" y="623" class="n-copy">handoff · complete</text><text x="584" y="648" class="n-copy">fail · transfer …</text></g>
  <!-- split/join row -->
  <g transform="translate(93 776)"><rect width="1420" height="68" rx="18" fill="#FFFFFF" stroke="#E2E8F0"/><text x="28" y="43" class="n-copy">父 WorkUnit</text><path d="M172 34h120" stroke="#2563EB" stroke-width="3" marker-end="url(#blueArrow)"/><rect x="315" y="15" width="140" height="38" rx="19" fill="#EEF2FF"/><text x="343" y="40" class="pill">child A</text><rect x="490" y="15" width="140" height="38" rx="19" fill="#EEF2FF"/><text x="518" y="40" class="pill">child B</text><rect x="665" y="15" width="140" height="38" rx="19" fill="#EEF2FF"/><text x="693" y="40" class="pill">child C</text><path d="M832 34h120" stroke="#2563EB" stroke-width="3" marker-end="url(#blueArrow)"/><text x="975" y="43" class="n-copy">join 策略：all / quorum / first-success</text></g>
</svg>
