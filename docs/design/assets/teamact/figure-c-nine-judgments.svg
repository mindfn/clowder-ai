<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-labelledby="title desc">
  <title id="title">TeamAct 九条设计判断的四组结构</title>
  <desc id="desc">九条设计判断按责任边界、存活与换手、协作扩展、上下文与恢复分为四组，中央由协调账本连接。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F8FBFF"/><stop offset="1" stop-color="#F7F3FF"/></linearGradient>
    <filter id="s" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#1E293B" flood-opacity=".1"/></filter>
    <style>
      .f{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC","Segoe UI",sans-serif}
      .h{font-size:42px;font-weight:760;fill:#172033}
      .sub{font-size:20px;fill:#64748B}
      .group{font-size:25px;font-weight:740;fill:#172033}
      .item{font-size:20px;font-weight:650;fill:#172033}
      .copy{font-size:17px;fill:#475569}
      .center{font-size:25px;font-weight:760;fill:#fff}
      .tag{font-size:16px;font-weight:700}
    </style>
  </defs>
  <rect width="1600" height="960" rx="32" fill="url(#bg)"/>
  <text x="80" y="86" class="f h">九条判断不是清单，而是四组机制</text>
  <text x="80" y="122" class="f sub">先建立责任边界，再解决存活与换手；协作扩展和上下文恢复建立在其上</text>

  <g filter="url(#s)">
    <rect x="82" y="184" width="580" height="286" rx="28" fill="#EFF6FF" stroke="#93C5FD" stroke-width="3"/>
    <rect x="106" y="207" width="130" height="34" rx="17" fill="#2563EB"/><text x="171" y="230" text-anchor="middle" class="f tag" fill="#fff">责任边界</text>
    <text x="110" y="282" class="f group">谁被叫醒、谁负责、谁能批准</text>
    <text x="110" y="330" class="f item">① 唤醒 ≠ 义务 ≠ 可读</text>
    <text x="110" y="368" class="f item">② 人是一等执行者</text>
    <text x="110" y="420" class="f copy">先把注意力、责任与授权拆开，后续状态才有意义。</text>

    <rect x="938" y="184" width="580" height="286" rx="28" fill="#FFF7ED" stroke="#FDBA74" stroke-width="3"/>
    <rect x="962" y="207" width="150" height="34" rx="17" fill="#EA580C"/><text x="1037" y="230" text-anchor="middle" class="f tag" fill="#fff">存活与换手</text>
    <text x="966" y="282" class="f group">执行者消失后，工作怎样继续</text>
    <text x="966" y="326" class="f item">③ 静默死亡靠生命迹象探测</text>
    <text x="966" y="364" class="f item">④ 易主需要授权 + CAS + fencing</text>
    <text x="966" y="402" class="f item">⑤ 独立验证绑定不可变坐标</text>
    <text x="966" y="441" class="f copy">Claim 跨 Attempt 存续；换人不等于换工作。</text>

    <rect x="82" y="590" width="580" height="286" rx="28" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="3"/>
    <rect x="106" y="613" width="130" height="34" rx="17" fill="#059669"/><text x="171" y="636" text-anchor="middle" class="f tag" fill="#fff">协作扩展</text>
    <text x="110" y="688" class="f group">一个回合怎样扩成一支团队</text>
    <text x="110" y="740" class="f item">⑥ 委派按责任边界递归</text>
    <text x="110" y="786" class="f item">⑦ push 降延迟，pull 从共享状态发现</text>
    <text x="110" y="832" class="f copy">模式可混用；Claim、SLA 与掉球探测保持不变。</text>

    <rect x="938" y="590" width="580" height="286" rx="28" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="3"/>
    <rect x="962" y="613" width="160" height="34" rx="17" fill="#7C3AED"/><text x="1042" y="636" text-anchor="middle" class="f tag" fill="#fff">上下文与恢复</text>
    <text x="966" y="688" class="f group">换会话、换人以后怎样不失真</text>
    <text x="966" y="740" class="f item">⑧ 契约传意图，回读传细节</text>
    <text x="966" y="786" class="f item">⑨ 四层记忆 + 多源重建</text>
    <text x="966" y="832" class="f copy">失忆是默认条件；关键协作状态不得只在 prompt 里。</text>
  </g>

  <g filter="url(#s)">
    <circle cx="800" cy="530" r="126" fill="#172033" stroke="#334155" stroke-width="5"/>
    <text x="800" y="516" text-anchor="middle" class="f center">Coordination</text>
    <text x="800" y="550" text-anchor="middle" class="f center">Ledger</text>
    <text x="800" y="582" text-anchor="middle" class="f tag" fill="#CBD5E1">责任状态的共同真相源</text>
  </g>

  <path d="M682 398 C720 420 738 442 752 466" fill="none" stroke="#60A5FA" stroke-width="5"/>
  <path d="M918 398 C880 420 862 442 848 466" fill="none" stroke="#FB923C" stroke-width="5"/>
  <path d="M682 690 C720 660 738 630 752 594" fill="none" stroke="#34D399" stroke-width="5"/>
  <path d="M918 690 C880 660 862 630 848 594" fill="none" stroke="#A78BFA" stroke-width="5"/>
</svg>
