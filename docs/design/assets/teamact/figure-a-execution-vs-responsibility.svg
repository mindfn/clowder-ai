<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800" role="img" aria-labelledby="title desc">
  <title id="title">执行编排层与责任协调层</title><desc id="desc">执行编排层回答任务如何被执行；责任协调层以 Actor、WorkUnit、责任指派（assigned/transfer-pending 态有执行责任人，unassigned/offered/suspended 态有处置责任人；公共 envelope 版本化）、按 scope 的职权授予、上下文就绪与协调账本回答团队如何对工作负责。人类在上层是人工介入点，在下层是一等执行者并带有 SLA。</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F8FAFC"/><stop offset="1" stop-color="#EEF2FF"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="8" stdDeviation="11" flood-color="#1E293B" flood-opacity=".1"/></filter><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#64748B"/></marker><style>.f{font-family:Inter,'Noto Sans CJK SC','PingFang SC',sans-serif}.h{fill:#172554;font-size:35px;font-weight:750}.s{fill:#64748B;font-size:18px}.t{fill:#172554;font-size:25px;font-weight:750}.c{fill:#475569;font-size:16px}.tag{font-size:14px;font-weight:750}</style></defs>
  <rect width="1600" height="800" rx="32" fill="url(#bg)"/><text x="80" y="85" class="f h">两个互补的层：从执行编排到责任协调</text><text x="80" y="119" class="f s">TeamAct 不替代现有框架；它补上跨 actor、跨会话的责任语义</text>
  <!-- top -->
  <g class="f" filter="url(#s)"><rect x="80" y="175" width="1440" height="237" rx="28" fill="#EFF6FF" stroke="#93C5FD" stroke-width="2"/><rect x="110" y="202" width="150" height="32" rx="16" fill="#DBEAFE"/><text x="132" y="225" class="tag" fill="#1D4ED8">已有框架的领地</text><text x="110" y="276" class="t">执行编排 · Execution orchestration</text><text x="110" y="309" class="c">回答：任务怎么被执行？</text><g transform="translate(656 231)"><rect width="175" height="72" rx="16" fill="#fff" stroke="#BFDBFE"/><text x="31" y="31" class="t" style="font-size:19px">Orchestrator</text><text x="37" y="55" class="c" style="font-size:14px">分解与调度</text></g><path d="M831 267h70" stroke="#2563EB" stroke-width="3" marker-end="url(#a)"/><g transform="translate(910 231)"><rect width="175" height="72" rx="16" fill="#fff" stroke="#BFDBFE"/><text x="45" y="31" class="t" style="font-size:19px">Graph / crew</text><text x="44" y="55" class="c" style="font-size:14px">流程与角色</text></g><path d="M1085 267h70" stroke="#2563EB" stroke-width="3" marker-end="url(#a)"/><g transform="translate(1164 231)"><rect width="175" height="72" rx="16" fill="#fff" stroke="#BFDBFE"/><text x="48" y="31" class="t" style="font-size:19px">Handoff</text><text x="33" y="55" class="c" style="font-size:14px">执行者间移交</text></g><g transform="translate(1325 324)"><circle cx="42" cy="32" r="27" fill="#2563EB"/><circle cx="42" cy="22" r="9" fill="#fff"/><path d="M25 52c5-15 29-15 34 0" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/><text x="80" y="27" class="c">人：HITL</text><text x="80" y="50" class="c">暂停 / 批准点</text></g></g>
  <!-- bridge -->
  <g class="f"><path d="M800 412v59" stroke="#64748B" stroke-width="3" marker-end="url(#a)"/><rect x="688" y="426" width="224" height="34" rx="17" fill="#fff" stroke="#CBD5E1"/><text x="715" y="449" class="tag" fill="#475569">跨会话、跨 actor 时</text></g>
  <!-- bottom -->
  <g class="f" filter="url(#s)"><rect x="80" y="490" width="1440" height="237" rx="28" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="2"/><rect x="110" y="517" width="169" height="32" rx="16" fill="#EDE9FE"/><text x="132" y="540" class="tag" fill="#6D28D9">TeamAct 的着力点</text><text x="110" y="591" class="t">责任协调 · Responsibility coordination</text><text x="110" y="624" class="c">回答：团队怎么对工作负责？</text><text x="110" y="652" class="c" style="font-size:14px">责任连续 · 按 scope 职权续接 · 上下文就绪</text><g transform="translate(590 584)"><rect width="140" height="74" rx="16" fill="#fff" stroke="#C4B5FD"/><text x="23" y="32" class="t" style="font-size:19px">WorkUnit</text><text x="25" y="57" class="c" style="font-size:14px">可移交工作</text></g><path d="M730 605 C752 592 766 568 784 558" stroke="#7C3AED" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M730 621h54" stroke="#7C3AED" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M730 637 C752 650 766 674 784 684" stroke="#7C3AED" stroke-width="3" fill="none" marker-end="url(#a)"/><g transform="translate(790 528)"><rect width="260" height="56" rx="15" fill="#fff" stroke="#C4B5FD"/><text x="18" y="24" class="t" style="font-size:15px">责任指派 · Assignment</text><text x="18" y="45" class="c" style="font-size:12px">执行或处置责任人 · envelope 版本</text></g><g transform="translate(790 592)"><rect width="260" height="56" rx="15" fill="#fff" stroke="#C4B5FD"/><text x="18" y="24" class="t" style="font-size:15px">职权授予 · Grant</text><text x="18" y="45" class="c" style="font-size:12px">谁可行动 · per-scope 版本</text></g><g transform="translate(790 656)"><rect width="260" height="56" rx="15" fill="#fff" stroke="#C4B5FD"/><text x="18" y="24" class="t" style="font-size:15px">上下文就绪 · ContextReady</text><text x="18" y="45" class="c" style="font-size:12px">确认先于获权 · 快照 + 在途清单</text></g><path d="M1050 556 C1068 566 1082 592 1099 606" stroke="#7C3AED" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M1050 620h49" stroke="#7C3AED" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M1050 684 C1068 674 1082 648 1099 636" stroke="#7C3AED" stroke-width="3" fill="none" marker-end="url(#a)"/><g transform="translate(1105 584)"><rect width="182" height="74" rx="16" fill="#fff" stroke="#C4B5FD"/><text x="28" y="32" class="t" style="font-size:19px">协调账本</text><text x="31" y="57" class="c" style="font-size:14px">可审计迁移</text></g><g transform="translate(1325 635)"><circle cx="40" cy="30" r="26" fill="#7C3AED"/><circle cx="40" cy="21" r="9" fill="#fff"/><path d="M23 50c5-15 29-15 34 0" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/><text x="78" y="26" class="c">人：一等执行者</text><text x="78" y="49" class="c">承担 / SLA / 探测</text></g></g>
</svg>
