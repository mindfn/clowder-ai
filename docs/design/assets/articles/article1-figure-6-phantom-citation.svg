<svg xmlns="http://www.w3.org/2000/svg" width="880" height="560" viewBox="0 0 880 560" font-family="PingFang SC, Noto Sans CJK SC, Helvetica Neue, sans-serif">
  <title>脑内的正文锚点与读者手上发布文本的错位</title>
  <desc>审稿人引用的正文一章二节只存在于内部文档。读者拿到的发布文本第一章没有子节，因此查无此节。</desc>
  <rect width="880" height="560" fill="#ffffff"/>
  <text x="40" y="48" font-size="24" font-weight="600" fill="#1a1a1a">脑内状态 vs 纸面：同一个“§1.2”去了哪里</text>

  <!-- column headers -->
  <text x="215" y="96" font-size="20" font-weight="600" fill="#3d5a78" text-anchor="middle">审稿人脑内的锚点</text>
  <text x="665" y="96" font-size="20" font-weight="600" fill="#337a5e" text-anchor="middle">读者手上的发布文本</text>

  <!-- internal document -->
  <rect x="40" y="116" width="350" height="350" rx="12" fill="#f4f7fa" stroke="#9eb3c7" stroke-width="2"/>
  <rect x="64" y="140" width="116" height="38" rx="19" fill="#e4edf5"/>
  <text x="122" y="165" font-size="20" font-weight="600" fill="#3d5a78" text-anchor="middle">内部文档</text>
  <text x="64" y="222" font-size="28" font-weight="700" fill="#1a1a1a">§1.2</text>
  <text x="64" y="254" font-size="20" fill="#333333">问题声明、评价标准与解法选择</text>
  <line x1="64" y1="278" x2="366" y2="278" stroke="#c9d6e2" stroke-width="2"/>
  <text x="64" y="312" font-size="20" font-weight="600" fill="#3d5a78">四个代价维度</text>

  <rect x="64" y="326" width="142" height="54" rx="8" fill="#ffffff" stroke="#c9d6e2" stroke-width="1.5"/>
  <text x="135" y="349" font-size="20" fill="#333333" text-anchor="middle">上下文</text>
  <text x="135" y="372" font-size="20" fill="#333333" text-anchor="middle">不可恢复率</text>
  <rect x="218" y="326" width="148" height="54" rx="8" fill="#ffffff" stroke="#c9d6e2" stroke-width="1.5"/>
  <text x="292" y="360" font-size="20" fill="#333333" text-anchor="middle">恢复延迟</text>
  <rect x="64" y="392" width="142" height="54" rx="8" fill="#ffffff" stroke="#c9d6e2" stroke-width="1.5"/>
  <text x="135" y="426" font-size="20" fill="#333333" text-anchor="middle">协调开销</text>
  <rect x="218" y="392" width="148" height="54" rx="8" fill="#ffffff" stroke="#c9d6e2" stroke-width="1.5"/>
  <text x="292" y="426" font-size="20" fill="#333333" text-anchor="middle">误判处置率</text>

  <!-- citation that misses its target -->
  <text x="440" y="194" font-size="20" font-weight="600" fill="#a0554c" text-anchor="middle">引用为</text>
  <text x="440" y="222" font-size="20" font-weight="600" fill="#a0554c" text-anchor="middle">“正文 §1.2”</text>
  <line x1="390" y1="250" x2="460" y2="250" stroke="#c98a80" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#arrowRed)"/>
  <circle cx="475" cy="250" r="15" fill="#ffffff" stroke="#c98a80" stroke-width="2.5"/>
  <path d="M468 243 L482 257 M482 243 L468 257" stroke="#c98a80" stroke-width="2.5" stroke-linecap="round"/>

  <!-- published text directory -->
  <rect x="490" y="116" width="350" height="350" rx="12" fill="#f2f8f5" stroke="#9bc8b7" stroke-width="2"/>
  <rect x="514" y="140" width="116" height="38" rx="19" fill="#e1f0e9"/>
  <text x="572" y="165" font-size="20" font-weight="600" fill="#337a5e" text-anchor="middle">发布文本</text>

  <text x="518" y="218" font-size="21" font-weight="600" fill="#333333">§1　我们撞上的问题</text>
  <text x="788" y="218" font-size="20" fill="#666666" text-anchor="end">无 1.1 / 1.2</text>
  <line x1="518" y1="236" x2="812" y2="236" stroke="#c4dcd2" stroke-width="1.5"/>
  <text x="518" y="272" font-size="21" fill="#333333">§2　五类失效</text>
  <line x1="518" y1="290" x2="812" y2="290" stroke="#c4dcd2" stroke-width="1.5"/>
  <text x="518" y="326" font-size="21" fill="#333333">§3　TeamAct</text>
  <text x="812" y="326" font-size="20" fill="#666666" text-anchor="end">3.1–3.5</text>
  <line x1="518" y1="344" x2="812" y2="344" stroke="#c4dcd2" stroke-width="1.5"/>
  <text x="518" y="380" font-size="21" fill="#333333">§4–§9 ＋ 附录</text>

  <rect x="514" y="402" width="302" height="44" rx="8" fill="#faf1f0" stroke="#c98a80" stroke-width="2"/>
  <text x="534" y="430" font-size="20" font-weight="600" fill="#8a4038">查找“§1.2”</text>
  <text x="796" y="430" font-size="20" font-weight="600" fill="#8a4038" text-anchor="end">查无此节</text>

  <!-- conclusion -->
  <text x="440" y="518" font-size="21" font-weight="600" fill="#1a1a1a" text-anchor="middle">内部文档里存在 ≠ 读者拿到的发布文本里存在</text>

  <defs>
    <marker id="arrowRed" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#c98a80"/>
    </marker>
  </defs>
</svg>
