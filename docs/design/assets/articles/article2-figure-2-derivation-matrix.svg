<svg xmlns="http://www.w3.org/2000/svg" width="880" height="720" viewBox="0 0 880 720" font-family="PingFang SC, Noto Sans CJK SC, Helvetica Neue, sans-serif">
  <rect width="880" height="720" fill="#ffffff"/>
  <text x="40" y="48" font-size="24" font-weight="600" fill="#1a1a1a">从事故到机制：中间隔着结果要求与验收前提</text>

  <!-- column headers -->
  <text x="155" y="98" font-size="20" font-weight="600" fill="#666666" text-anchor="middle">输入：失效·约束·风险</text>
  <text x="445" y="98" font-size="20" font-weight="600" fill="#666666" text-anchor="middle">结果要求与验收前提</text>
  <text x="725" y="98" font-size="20" font-weight="600" fill="#666666" text-anchor="middle">机制</text>

  <!-- domain constraint (distinct visual class: dashed border) -->
  <rect x="40" y="118" width="230" height="72" rx="9" fill="#f7f7f7" stroke="#8a8a8a" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="155" y="146" font-size="20" fill="#333333" text-anchor="middle">域内约束（非事故）</text>
  <text x="155" y="174" font-size="20" fill="#666666" text-anchor="middle">副作用不可重复/并发</text>

  <!-- failure cards -->
  <rect x="40" y="206" width="230" height="52" rx="9" fill="#faf1f0" stroke="#c98a80" stroke-width="1.5"/>
  <text x="155" y="238" font-size="20" fill="#333333" text-anchor="middle">义务误归属</text>
  <rect x="40" y="290" width="230" height="52" rx="9" fill="#faf1f0" stroke="#c98a80" stroke-width="1.5"/>
  <text x="155" y="322" font-size="20" fill="#333333" text-anchor="middle">续接断链</text>
  <rect x="40" y="374" width="230" height="52" rx="9" fill="#faf1f0" stroke="#c98a80" stroke-width="1.5"/>
  <text x="155" y="406" font-size="20" fill="#333333" text-anchor="middle">人工责任悬置</text>
  <rect x="40" y="458" width="230" height="52" rx="9" fill="#faf1f0" stroke="#c98a80" stroke-width="1.5"/>
  <text x="155" y="490" font-size="20" fill="#333333" text-anchor="middle">执行静默失联</text>

  <!-- acceptance risk (third input class: dashed, non-incident) -->
  <rect x="40" y="546" width="230" height="72" rx="9" fill="#f7f7f7" stroke="#8a8a8a" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="155" y="574" font-size="20" fill="#333333" text-anchor="middle">验收风险（非事故）</text>
  <text x="155" y="602" font-size="20" fill="#666666" text-anchor="middle">自证完成可能为假</text>
  <text x="155" y="650" font-size="20" fill="#999999" text-anchor="middle">（时序失真属投影问题，显式排除）</text>

  <!-- outcome nodes -->
  <rect x="360" y="118" width="170" height="72" rx="10" fill="#f4f7fa" stroke="#5b7fa6" stroke-width="2"/>
  <text x="445" y="147" font-size="20" font-weight="600" fill="#5b7fa6" text-anchor="middle">O1</text>
  <text x="445" y="174" font-size="20" fill="#333333" text-anchor="middle">副作用不重复</text>
  <rect x="360" y="228" width="170" height="72" rx="10" fill="#f2f8f5" stroke="#4a9d7f" stroke-width="2"/>
  <text x="445" y="257" font-size="20" font-weight="600" fill="#4a9d7f" text-anchor="middle">O2</text>
  <text x="445" y="284" font-size="20" fill="#333333" text-anchor="middle">责任可重建</text>
  <rect x="360" y="352" width="170" height="72" rx="10" fill="#faf6f1" stroke="#c47a4a" stroke-width="2"/>
  <text x="445" y="381" font-size="20" font-weight="600" fill="#c47a4a" text-anchor="middle">O3</text>
  <text x="445" y="408" font-size="20" fill="#333333" text-anchor="middle">换手安全继续</text>
  <rect x="360" y="472" width="170" height="72" rx="10" fill="#f6f3f8" stroke="#6b4d8a" stroke-width="2"/>
  <text x="445" y="501" font-size="20" font-weight="600" fill="#6b4d8a" text-anchor="middle">O4</text>
  <text x="445" y="528" font-size="20" fill="#333333" text-anchor="middle">失效有界处置</text>

  <!-- termination admission premise (NOT an outcome: dashed, distinct class) -->
  <rect x="352" y="560" width="186" height="72" rx="10" fill="#f7f7f7" stroke="#8a8a8a" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="445" y="588" font-size="20" fill="#333333" text-anchor="middle">终结准入前提</text>
  <text x="445" y="616" font-size="20" fill="#666666" text-anchor="middle">执行终止≠工作完成</text>

  <!-- mechanism cards -->
  <rect x="598" y="118" width="252" height="76" rx="9" fill="#f4f7fa" stroke="#c9d6e2" stroke-width="1.5"/>
  <text x="725" y="148" font-size="20" fill="#333333" text-anchor="middle">责任授权分离＋版本 fence</text>
  <text x="725" y="176" font-size="20" fill="#666666" text-anchor="middle">受控能力出口·不足则降级</text>

  <rect x="598" y="210" width="252" height="76" rx="9" fill="#f4f7fa" stroke="#c9d6e2" stroke-width="1.5"/>
  <text x="725" y="240" font-size="20" fill="#333333" text-anchor="middle">身份锚点＋工作单元</text>
  <text x="725" y="268" font-size="20" fill="#666666" text-anchor="middle">协调账本·回放重建</text>

  <rect x="598" y="326" width="252" height="76" rx="9" fill="#f4f7fa" stroke="#c9d6e2" stroke-width="1.5"/>
  <text x="725" y="356" font-size="20" fill="#333333" text-anchor="middle">两阶段交接＋降级恢复</text>
  <text x="725" y="384" font-size="20" fill="#666666" text-anchor="middle">上下文·记忆·交接三分</text>

  <rect x="598" y="452" width="252" height="52" rx="9" fill="#f4f7fa" stroke="#c9d6e2" stroke-width="1.5"/>
  <text x="725" y="484" font-size="20" fill="#333333" text-anchor="middle">独立巡检（逻辑存活根）</text>

  <rect x="598" y="524" width="252" height="76" rx="9" fill="#f4f7fa" stroke="#c9d6e2" stroke-width="1.5"/>
  <text x="725" y="554" font-size="20" fill="#333333" text-anchor="middle">完成门槛（按风险分档）</text>
  <text x="725" y="582" font-size="20" fill="#666666" text-anchor="middle">结论绑定产出坐标</text>

  <!-- inputs → outcomes -->
  <line x1="270" y1="154" x2="356" y2="154" stroke="#5b7fa6" stroke-width="2"/>
  <line x1="270" y1="232" x2="356" y2="258" stroke="#4a9d7f" stroke-width="2"/>
  <line x1="270" y1="316" x2="356" y2="384" stroke="#c47a4a" stroke-width="2"/>
  <line x1="270" y1="400" x2="356" y2="496" stroke="#6b4d8a" stroke-width="2"/>
  <line x1="270" y1="484" x2="356" y2="506" stroke="#6b4d8a" stroke-width="2"/>
  <line x1="270" y1="586" x2="348" y2="594" stroke="#8a8a8a" stroke-width="2"/>

  <!-- outcomes → mechanisms -->
  <line x1="530" y1="154" x2="594" y2="156" stroke="#5b7fa6" stroke-width="2"/>
  <line x1="530" y1="264" x2="594" y2="248" stroke="#4a9d7f" stroke-width="2"/>
  <line x1="530" y1="388" x2="594" y2="364" stroke="#c47a4a" stroke-width="2"/>
  <line x1="530" y1="508" x2="594" y2="478" stroke="#6b4d8a" stroke-width="2"/>
  <line x1="538" y1="594" x2="594" y2="566" stroke="#8a8a8a" stroke-width="2"/>

  <text x="440" y="692" font-size="20" font-weight="600" fill="#1a1a1a" text-anchor="middle">每个机制都能追溯到实测失效、域内约束或验收风险，经中立结果要求或终结准入前提引出</text>
</svg>
