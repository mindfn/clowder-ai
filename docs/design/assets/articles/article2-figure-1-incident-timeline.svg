<svg xmlns="http://www.w3.org/2000/svg" width="880" height="560" viewBox="0 0 880 560" font-family="PingFang SC, Noto Sans CJK SC, Helvetica Neue, sans-serif">
  <rect width="880" height="560" fill="#ffffff"/>
  <text x="40" y="48" font-size="24" font-weight="600" fill="#1a1a1a">审批卡事故：执行层零故障，责任线从未开始</text>

  <!-- time axis -->
  <line x1="120" y1="490" x2="850" y2="490" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="210" y="522" font-size="20" fill="#666666" text-anchor="middle">第一天晚</text>
  <text x="490" y="522" font-size="20" fill="#666666" text-anchor="middle">第二天—第三天问话前（安静）</text>
  <text x="770" y="522" font-size="20" fill="#666666" text-anchor="middle">第三天问话后</text>

  <!-- fork point vertical line -->
  <line x1="280" y1="70" x2="280" y2="490" stroke="#c98a80" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="292" y="88" font-size="20" fill="#c98a80">分叉点：承诺说出，载体未建</text>

  <!-- lane labels -->
  <text x="40" y="150" font-size="20" font-weight="600" fill="#c98a80">责任线</text>
  <text x="40" y="360" font-size="20" font-weight="600" fill="#4a9d7f">执行线</text>

  <!-- responsibility lane -->
  <rect x="120" y="120" width="150" height="76" rx="9" fill="#fdf6f5" stroke="#c98a80" stroke-width="1.5"/>
  <text x="195" y="150" font-size="20" fill="#333333" text-anchor="middle">承诺说出：</text>
  <text x="195" y="178" font-size="20" fill="#333333" text-anchor="middle">"明天交付"</text>

  <!-- ghost box: the record that never existed -->
  <rect x="300" y="120" width="360" height="76" rx="9" fill="none" stroke="#c98a80" stroke-width="1.5" stroke-dasharray="7 6"/>
  <text x="480" y="150" font-size="20" fill="#c98a80" text-anchor="middle">义务记录：从未创建</text>
  <text x="480" y="178" font-size="20" fill="#c98a80" text-anchor="middle">无状态 → 无超时 → 无告警</text>

  <rect x="690" y="120" width="160" height="76" rx="9" fill="#f2f8f5" stroke="#4a9d7f" stroke-width="1.5"/>
  <text x="770" y="150" font-size="20" fill="#333333" text-anchor="middle">人工发现 →</text>
  <text x="770" y="178" font-size="20" fill="#333333" text-anchor="middle">兜底任务＋补交付</text>

  <!-- discovery arrow from operator -->
  <text x="770" y="238" font-size="20" fill="#666666" text-anchor="middle">operator 问话</text>
  <line x1="770" y1="248" x2="770" y2="196" stroke="#666666" stroke-width="1.5" marker-end="url(#arrGray)"/>
  <text x="770" y="272" font-size="20" fill="#666666" text-anchor="middle">（发现机制＝人的记性）</text>

  <!-- execution lane -->
  <rect x="120" y="330" width="150" height="76" rx="9" fill="#f2f8f5" stroke="#4a9d7f" stroke-width="1.5"/>
  <text x="195" y="360" font-size="20" fill="#333333" text-anchor="middle">Run 正常起落</text>
  <text x="195" y="388" font-size="20" fill="#4a9d7f" text-anchor="middle">✓ 正常结束</text>

  <rect x="300" y="330" width="360" height="76" rx="9" fill="#f7f7f7" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="480" y="360" font-size="20" fill="#333333" text-anchor="middle">无消息 → 无执行</text>
  <text x="480" y="388" font-size="20" fill="#666666" text-anchor="middle">事件驱动运行时：安静＝按设计</text>

  <rect x="690" y="330" width="160" height="76" rx="9" fill="#f2f8f5" stroke="#4a9d7f" stroke-width="1.5"/>
  <text x="770" y="360" font-size="20" fill="#333333" text-anchor="middle">被问话唤醒</text>
  <text x="770" y="388" font-size="20" fill="#4a9d7f" text-anchor="middle">✓ 正常执行</text>

  <!-- lane summary tags -->
  <text x="480" y="452" font-size="20" fill="#4a9d7f" text-anchor="middle">执行层全程无一次故障</text>

  <defs>
    <marker id="arrGray" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#666666"/>
    </marker>
  </defs>
</svg>
