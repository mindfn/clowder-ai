<svg xmlns="http://www.w3.org/2000/svg" width="880" height="632" viewBox="0 0 880 632" font-family="PingFang SC, Noto Sans CJK SC, Helvetica Neue, sans-serif">
  <rect width="880" height="632" fill="#ffffff"/>
  <text x="40" y="48" font-size="24" font-weight="600" fill="#1a1a1a">从静默失联到安全处置：巡检者的动作边界</text>

  <!-- lanes -->
  <text x="40" y="140" font-size="20" font-weight="600" fill="#5b7fa6">reconciler</text>
  <text x="40" y="164" font-size="20" fill="#999999">（确定性巡检）</text>
  <text x="40" y="330" font-size="20" font-weight="600" fill="#333333">工作状态</text>
  <text x="40" y="500" font-size="20" font-weight="600" fill="#6b4d8a">授权主体</text>
  <line x1="170" y1="120" x2="850" y2="120" stroke="#e8e8e8" stroke-width="1"/>
  <line x1="170" y1="300" x2="850" y2="300" stroke="#e8e8e8" stroke-width="1"/>
  <line x1="170" y1="470" x2="850" y2="470" stroke="#e8e8e8" stroke-width="1"/>

  <!-- work state timeline -->
  <rect x="180" y="316" width="150" height="52" rx="9" fill="#f7f7f7" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="255" y="340" font-size="20" fill="#333333" text-anchor="middle">生命迹象断供</text>
  <text x="255" y="362" font-size="20" fill="#666666" text-anchor="middle">（执行者不自报）</text>

  <rect x="390" y="316" width="180" height="52" rx="9" fill="#fdf6f5" stroke="#c98a80" stroke-width="1.5"/>
  <text x="480" y="340" font-size="20" fill="#333333" text-anchor="middle">冻结＋悬置</text>
  <text x="480" y="362" font-size="20" fill="#666666" text-anchor="middle">（可审计的安全态）</text>

  <rect x="640" y="286" width="200" height="48" rx="9" fill="#f2f8f5" stroke="#4a9d7f" stroke-width="1.5"/>
  <text x="740" y="316" font-size="20" fill="#333333" text-anchor="middle">恢复交接（降级路径）</text>
  <rect x="640" y="350" width="200" height="48" rx="9" fill="#f7f7f7" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="740" y="380" font-size="20" fill="#333333" text-anchor="middle">或：继续悬置等待</text>

  <line x1="330" y1="342" x2="386" y2="342" stroke="#8a8a8a" stroke-width="2" marker-end="url(#arrG)"/>
  <line x1="570" y1="330" x2="636" y2="312" stroke="#4a9d7f" stroke-width="2" marker-end="url(#arrGr)"/>
  <line x1="570" y1="354" x2="636" y2="372" stroke="#8a8a8a" stroke-width="2" marker-end="url(#arrG)"/>

  <!-- reconciler actions: solid = direct -->
  <rect x="180" y="180" width="170" height="76" rx="9" fill="#f4f7fa" stroke="#5b7fa6" stroke-width="2"/>
  <text x="265" y="208" font-size="20" fill="#333333" text-anchor="middle">有界探测（谓词）</text>
  <text x="265" y="236" font-size="20" fill="#333333" text-anchor="middle">超时 · 版本 · 落账</text>
  <line x1="265" y1="256" x2="260" y2="312" stroke="#5b7fa6" stroke-width="2" marker-end="url(#arrB)"/>

  <rect x="620" y="180" width="230" height="48" rx="9" fill="#f4f7fa" stroke="#5b7fa6" stroke-width="2"/>
  <text x="735" y="210" font-size="20" fill="#333333" text-anchor="middle">催办 · 预声明的机械重放</text>

  <!-- reconciler proposal: dashed = proposal only -->
  <rect x="390" y="180" width="180" height="48" rx="9" fill="#ffffff" stroke="#5b7fa6" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="480" y="210" font-size="20" fill="#5b7fa6" text-anchor="middle">悬置/转移：仅提案</text>
  <line x1="480" y1="228" x2="480" y2="484" stroke="#6b4d8a" stroke-width="1.5" stroke-dasharray="7 5" marker-end="url(#arrP)"/>

  <!-- authority signs -->
  <rect x="390" y="490" width="180" height="52" rx="9" fill="#f6f3f8" stroke="#6b4d8a" stroke-width="2"/>
  <text x="480" y="514" font-size="20" fill="#333333" text-anchor="middle">按预声明策略签署</text>
  <text x="480" y="538" font-size="20" fill="#666666" text-anchor="middle">（选人·批准在这层）</text>
  <line x1="575" y1="505" x2="618" y2="380" stroke="#6b4d8a" stroke-width="2" marker-end="url(#arrP)"/>
  <text x="640" y="440" font-size="20" fill="#6b4d8a">签署后生效</text>

  <!-- boundary legend -->
  <text x="180" y="580" font-size="20" fill="#5b7fa6">— 实线：巡检者直接做（探测 / 催办 / 机械重放）</text>
  <text x="180" y="612" font-size="20" fill="#5b7fa6">- - 虚线：只能提案——不选人、不分派、不批准</text>

  <defs>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#5b7fa6"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#8a8a8a"/></marker>
    <marker id="arrGr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#4a9d7f"/></marker>
    <marker id="arrP" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#6b4d8a"/></marker>
  </defs>
</svg>
