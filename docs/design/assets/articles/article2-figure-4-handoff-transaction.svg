<svg xmlns="http://www.w3.org/2000/svg" width="880" height="680" viewBox="0 0 880 680" font-family="PingFang SC, Noto Sans CJK SC, Helvetica Neue, sans-serif">
  <rect width="880" height="680" fill="#ffffff"/>
  <text x="40" y="48" font-size="24" font-weight="600" fill="#1a1a1a">两阶段交接：封存 → 确认 → 原子翻转，旧凭据同刻作废</text>

  <!-- phase backgrounds -->
  <rect x="130" y="100" width="330" height="420" rx="12" fill="#fafafa" stroke="#e0e0e0" stroke-width="1"/>
  <rect x="470" y="100" width="380" height="420" rx="12" fill="#f4f7fa" stroke="#c9d6e2" stroke-width="1"/>
  <text x="295" y="130" font-size="20" font-weight="600" fill="#666666" text-anchor="middle">阶段一 · 封存（A 仍在责任上）</text>
  <text x="660" y="130" font-size="20" font-weight="600" fill="#5b7fa6" text-anchor="middle">阶段二 · 确认与翻转</text>

  <!-- lanes -->
  <text x="40" y="200" font-size="20" font-weight="600" fill="#333333">A 前任</text>
  <text x="40" y="330" font-size="20" font-weight="600" fill="#333333">账本</text>
  <text x="40" y="460" font-size="20" font-weight="600" fill="#333333">B 继任</text>
  <line x1="130" y1="195" x2="850" y2="195" stroke="#d9d9d9" stroke-width="1"/>
  <line x1="130" y1="325" x2="850" y2="325" stroke="#d9d9d9" stroke-width="1"/>
  <line x1="130" y1="455" x2="850" y2="455" stroke="#d9d9d9" stroke-width="1"/>

  <!-- phase 1 actions -->
  <rect x="150" y="160" width="140" height="48" rx="8" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="220" y="190" font-size="20" fill="#333333" text-anchor="middle">停止新副作用</text>

  <line x1="250" y1="212" x2="250" y2="300" stroke="#5b7fa6" stroke-width="2" marker-end="url(#arrBlue)"/>
  <rect x="170" y="236" width="164" height="48" rx="8" fill="#ffffff" stroke="#5b7fa6" stroke-width="1.5"/>
  <text x="252" y="256" font-size="20" fill="#333333" text-anchor="middle">快照定版：事实·</text>
  <text x="252" y="278" font-size="20" fill="#333333" text-anchor="middle">意图·边界·行动</text>

  <line x1="400" y1="212" x2="400" y2="300" stroke="#5b7fa6" stroke-width="2" marker-end="url(#arrBlue)"/>
  <rect x="344" y="236" width="150" height="48" rx="8" fill="#fdf6f5" stroke="#c98a80" stroke-width="1.5"/>
  <text x="419" y="256" font-size="20" fill="#333333" text-anchor="middle">封存在途清单：</text>
  <text x="419" y="278" font-size="20" fill="#333333" text-anchor="middle">已发出未返回</text>

  <!-- ledger seals phase1 -->
  <rect x="230" y="336" width="200" height="44" rx="8" fill="#f7f7f7" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="330" y="364" font-size="20" fill="#333333" text-anchor="middle">封存记录落账（定版）</text>

  <!-- phase 2: deliver to B -->
  <line x1="510" y1="380" x2="510" y2="440" stroke="#5b7fa6" stroke-width="2" marker-end="url(#arrBlue)"/>
  <text x="510" y="418" font-size="20" fill="#666666" text-anchor="start" dx="10">快照＋清单送达</text>

  <!-- B ack -->
  <rect x="540" y="466" width="180" height="44" rx="8" fill="#f2f8f5" stroke="#4a9d7f" stroke-width="1.5"/>
  <text x="630" y="494" font-size="20" fill="#333333" text-anchor="middle">就绪确认（ack）</text>
  <line x1="700" y1="460" x2="700" y2="386" stroke="#4a9d7f" stroke-width="2" marker-end="url(#arrGreen)"/>

  <!-- commit -->
  <rect x="716" y="336" width="122" height="72" rx="8" fill="#f4f7fa" stroke="#5b7fa6" stroke-width="2.5"/>
  <text x="777" y="364" font-size="20" font-weight="600" fill="#5b7fa6" text-anchor="middle">commit</text>
  <text x="777" y="392" font-size="20" fill="#333333" text-anchor="middle">原子翻转 v+1</text>

  <!-- ack precedes commit note -->
  <text x="660" y="540" font-size="20" fill="#4a9d7f" text-anchor="middle">就绪先于获权：无 ack 则翻转不发生</text>

  <!-- credential line -->
  <line x1="130" y1="600" x2="777" y2="600" stroke="#c47a4a" stroke-width="2.5"/>
  <line x1="777" y1="600" x2="850" y2="600" stroke="#4a9d7f" stroke-width="2.5"/>
  <line x1="777" y1="586" x2="777" y2="614" stroke="#c98a80" stroke-width="2.5"/>
  <text x="846" y="572" font-size="20" fill="#c98a80" text-anchor="end">旧凭据同刻作废 ✕</text>
  <text x="846" y="628" font-size="20" fill="#4a9d7f" text-anchor="end">B 凭据 v+1 生效</text>
  <text x="130" y="628" font-size="20" fill="#c47a4a">A 凭据（v）存续</text>

  <!-- three failure points sealed -->
  <text x="419" y="222" font-size="20" fill="#c98a80" text-anchor="middle">⊘ 在途蒸发</text>
  <text x="750" y="446" font-size="20" fill="#c98a80" text-anchor="middle">⊘ 无确认</text>
  <text x="360" y="590" font-size="20" fill="#c98a80" text-anchor="middle">⊘ 旧权存活</text>

  <defs>
    <marker id="arrBlue" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#5b7fa6"/>
    </marker>
    <marker id="arrGreen" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#4a9d7f"/>
    </marker>
  </defs>
</svg>
