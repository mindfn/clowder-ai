<svg xmlns="http://www.w3.org/2000/svg" width="880" height="470" viewBox="0 0 880 470" font-family="PingFang SC, Noto Sans CJK SC, Helvetica Neue, sans-serif">
  <rect width="880" height="470" fill="#ffffff"/>
  <text x="40" y="44" font-size="19" font-weight="600" fill="#1a1a1a">冷读是怎么运转的</text>

  <!-- lane labels -->
  <text x="40" y="106" font-size="13" font-weight="600" fill="#3d5a78">作者与审稿成员</text>
  <text x="40" y="406" font-size="13" font-weight="600" fill="#337a5e">零上下文冷读者</text>

  <!-- isolation wall -->
  <line x1="40" y1="250" x2="840" y2="250" stroke="#b8b8b8" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="835" y="242" font-size="11.5" fill="#8a8a8a" text-anchor="end">隔离：无讨论历史 · 无内部规范 · 无作者转述</text>

  <!-- author lane: internal drafting -->
  <rect x="60" y="120" width="150" height="56" rx="8" fill="#f4f7fa" stroke="#c9d6e2" stroke-width="1.5"/>
  <text x="135" y="144" font-size="12.5" fill="#333333" text-anchor="middle">内部稿多轮往返</text>
  <text x="135" y="162" font-size="11" fill="#8a8a8a" text-anchor="middle">跨模型家族写与审</text>

  <line x1="210" y1="148" x2="252" y2="148" stroke="#999999" stroke-width="1.5"/>
  <polygon points="252,143 264,148 252,153" fill="#999999"/>

  <!-- frozen text: the only pass-through -->
  <rect x="266" y="120" width="150" height="56" rx="8" fill="#fdf9ef" stroke="#d9c47e" stroke-width="2"/>
  <text x="341" y="144" font-size="12.5" font-weight="600" fill="#333333" text-anchor="middle">冻结发布文本</text>
  <text x="341" y="162" font-size="11" fill="#8a8a8a" text-anchor="middle">固定版本，唯一入口</text>

  <!-- frozen text crosses the wall -->
  <line x1="341" y1="176" x2="341" y2="340" stroke="#d9c47e" stroke-width="2"/>
  <polygon points="336,340 341,352 346,340" fill="#d9c47e"/>
  <text x="352" y="268" font-size="11" fill="#a08b45">唯一穿墙通道 ①：文本本身</text>

  <!-- cold reader reads -->
  <rect x="266" y="356" width="150" height="56" rx="8" fill="#f2f8f5" stroke="#c4dcd2" stroke-width="1.5"/>
  <text x="341" y="380" font-size="12.5" fill="#333333" text-anchor="middle">从头冷读</text>
  <text x="341" y="398" font-size="11" fill="#8a8a8a" text-anchor="middle">只在真实卡住处提问</text>

  <line x1="416" y1="384" x2="458" y2="384" stroke="#999999" stroke-width="1.5"/>
  <polygon points="458,379 470,384 458,389" fill="#999999"/>

  <!-- questions found -->
  <rect x="472" y="342" width="168" height="84" rx="8" fill="#faf1f0" stroke="#dcb3ad" stroke-width="1.5"/>
  <text x="556" y="366" font-size="12.5" font-weight="600" fill="#8a4038" text-anchor="middle">三个承重缺口</text>
  <text x="556" y="386" font-size="11" fill="#777777" text-anchor="middle">锚点未定义 · 边界无答案</text>
  <text x="556" y="404" font-size="11" fill="#777777" text-anchor="middle">证伪规则覆盖过窄</text>

  <!-- verbatim Q&A crosses the wall -->
  <line x1="556" y1="342" x2="556" y2="184" stroke="#dcb3ad" stroke-width="2"/>
  <polygon points="551,184 556,172 561,184" fill="#dcb3ad"/>
  <text x="566" y="268" font-size="11" fill="#a0554c">唯一穿墙通道 ②：逐字问答中转</text>

  <!-- author answers & revises -->
  <rect x="472" y="120" width="168" height="56" rx="8" fill="#f4f7fa" stroke="#c9d6e2" stroke-width="1.5"/>
  <text x="556" y="144" font-size="12.5" fill="#333333" text-anchor="middle">作者逐问作答</text>
  <text x="556" y="162" font-size="11" fill="#8a8a8a" text-anchor="middle">答案逐字转回，不加解释</text>

  <line x1="640" y1="148" x2="682" y2="148" stroke="#999999" stroke-width="1.5"/>
  <polygon points="682,143 694,148 682,153" fill="#999999"/>

  <!-- revision & exact-HEAD verification -->
  <rect x="696" y="120" width="144" height="56" rx="8" fill="#f6f3f8" stroke="#d5c8e0" stroke-width="1.5"/>
  <text x="768" y="144" font-size="12.5" fill="#333333" text-anchor="middle">修订落稿</text>
  <text x="768" y="162" font-size="11" fill="#8a8a8a" text-anchor="middle">按固定版本复核验收</text>

  <!-- bottom note -->
  <text x="440" y="452" font-size="13" font-weight="600" fill="#1a1a1a" text-anchor="middle">读者不携带作者的隐含前提——只有冻结文本和逐字问答能穿过隔离</text>
</svg>
