<svg xmlns="http://www.w3.org/2000/svg" width="880" height="790" viewBox="0 0 880 790" font-family="PingFang SC, Noto Sans CJK SC, Helvetica Neue, sans-serif">
  <rect width="880" height="790" fill="#ffffff"/>
  <text x="40" y="52" font-size="24" font-weight="600" fill="#1a1a1a">冷读是怎么运转的</text>

  <!-- vertical isolation wall -->
  <line x1="440" y1="132" x2="440" y2="700" stroke="#b0b0b0" stroke-width="2.5" stroke-dasharray="10 7"/>
  <text x="440" y="114" font-size="18" font-weight="600" fill="#666666" text-anchor="middle">隔离墙</text>
  <text x="440" y="726" font-size="20" fill="#666666" text-anchor="middle">无讨论历史 · 无内部规范 · 无作者转述</text>

  <!-- column headers -->
  <text x="230" y="152" font-size="20" font-weight="600" fill="#3d5a78" text-anchor="middle">作者与审稿成员</text>
  <text x="660" y="152" font-size="20" font-weight="600" fill="#337a5e" text-anchor="middle">零上下文冷读者</text>

  <!-- left: internal drafting -->
  <rect x="80" y="172" width="300" height="84" rx="10" fill="#f4f7fa" stroke="#c9d6e2" stroke-width="2"/>
  <text x="230" y="208" font-size="21" fill="#333333" text-anchor="middle">内部稿多轮往返</text>
  <text x="230" y="238" font-size="20" fill="#666666" text-anchor="middle">跨模型家族写与审</text>

  <line x1="230" y1="256" x2="230" y2="282" stroke="#999999" stroke-width="2"/>
  <polygon points="223,282 230,296 237,282" fill="#999999"/>

  <!-- left: frozen text -->
  <rect x="80" y="300" width="300" height="84" rx="10" fill="#fdf9ef" stroke="#c9a94f" stroke-width="2.5"/>
  <text x="230" y="336" font-size="21" font-weight="600" fill="#333333" text-anchor="middle">冻结发布文本</text>
  <text x="230" y="366" font-size="20" fill="#666666" text-anchor="middle">固定版本，唯一入口</text>

  <!-- channel 1 -->
  <line x1="380" y1="342" x2="556" y2="342" stroke="#c9a94f" stroke-width="3"/>
  <polygon points="556,334 574,342 556,350" fill="#c9a94f"/>
  <text x="468" y="326" font-size="20" font-weight="600" fill="#8f7527" text-anchor="middle">通道①：文本</text>

  <!-- right: cold reading -->
  <rect x="576" y="300" width="264" height="84" rx="10" fill="#f2f8f5" stroke="#c4dcd2" stroke-width="2"/>
  <text x="708" y="336" font-size="21" fill="#333333" text-anchor="middle">从头冷读</text>
  <text x="708" y="366" font-size="20" fill="#666666" text-anchor="middle">只在真实卡住处提问</text>

  <line x1="708" y1="384" x2="708" y2="410" stroke="#999999" stroke-width="2"/>
  <polygon points="701,410 708,424 715,410" fill="#999999"/>

  <!-- right: gaps found -->
  <rect x="576" y="428" width="264" height="118" rx="10" fill="#faf1f0" stroke="#c98a80" stroke-width="2"/>
  <text x="708" y="462" font-size="21" font-weight="600" fill="#8a4038" text-anchor="middle">三个承重缺口</text>
  <text x="708" y="492" font-size="20" fill="#666666" text-anchor="middle">锚点未定义 · 边界无答案</text>
  <text x="708" y="522" font-size="20" fill="#666666" text-anchor="middle">证伪规则覆盖过窄</text>

  <!-- channel 2: questions left, answers right -->
  <line x1="576" y1="462" x2="398" y2="462" stroke="#c98a80" stroke-width="3"/>
  <polygon points="398,454 380,462 398,470" fill="#c98a80"/>
  <text x="478" y="446" font-size="20" font-weight="600" fill="#a0554c" text-anchor="middle">问题逐字上交</text>

  <line x1="380" y1="506" x2="556" y2="506" stroke="#c98a80" stroke-width="3"/>
  <polygon points="556,498 574,506 556,514" fill="#c98a80"/>
  <text x="470" y="536" font-size="20" font-weight="600" fill="#a0554c" text-anchor="middle">答案逐字转回</text>

  <!-- left: author answers -->
  <rect x="80" y="428" width="300" height="118" rx="10" fill="#f4f7fa" stroke="#c9d6e2" stroke-width="2"/>
  <text x="230" y="462" font-size="21" fill="#333333" text-anchor="middle">作者逐问作答</text>
  <text x="230" y="492" font-size="20" fill="#666666" text-anchor="middle">中转不加解释、不删改</text>
  <text x="230" y="522" font-size="20" fill="#666666" text-anchor="middle">循环直到读者说停</text>

  <!-- right: reader verdict -->
  <rect x="576" y="590" width="264" height="84" rx="10" fill="#f2f8f5" stroke="#c4dcd2" stroke-width="2"/>
  <text x="708" y="626" font-size="21" fill="#333333" text-anchor="middle">读者收答或追问</text>
  <text x="708" y="656" font-size="20" fill="#666666" text-anchor="middle">追问则继续循环</text>

  <line x1="708" y1="546" x2="708" y2="578" stroke="#999999" stroke-width="2"/>
  <polygon points="701,578 708,590 715,578" fill="#999999"/>

  <!-- reader verdict gates the revision: closure arrow crosses wall -->
  <line x1="576" y1="632" x2="398" y2="632" stroke="#4a9d7f" stroke-width="3"/>
  <polygon points="398,624 380,632 398,640" fill="#4a9d7f"/>
  <text x="478" y="616" font-size="20" font-weight="600" fill="#337a5e" text-anchor="middle">"无更多问题"后闭环</text>

  <!-- left: revise & verify (entered only via reader closure) -->
  <rect x="80" y="590" width="300" height="84" rx="10" fill="#f6f3f8" stroke="#d5c8e0" stroke-width="2"/>
  <text x="230" y="626" font-size="21" fill="#333333" text-anchor="middle">修订落稿</text>
  <text x="230" y="656" font-size="20" fill="#666666" text-anchor="middle">按固定版本复核验收</text>

  <text x="440" y="768" font-size="20" font-weight="600" fill="#1a1a1a" text-anchor="middle">读者不携带作者的隐含前提——修订门由读者的闭环判定开启</text>
</svg>
