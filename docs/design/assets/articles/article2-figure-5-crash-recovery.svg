<svg xmlns="http://www.w3.org/2000/svg" width="880" height="640" viewBox="0 0 880 640" font-family="PingFang SC, Noto Sans CJK SC, Helvetica Neue, sans-serif">
  <rect width="880" height="640" fill="#ffffff"/>
  <text x="40" y="48" font-size="24" font-weight="600" fill="#1a1a1a">崩溃恢复：每份交接材料的替代来源与降级标记</text>

  <!-- column headers -->
  <rect x="150" y="86" width="300" height="48" rx="9" fill="#f4f7fa" stroke="#5b7fa6" stroke-width="1.5"/>
  <text x="300" y="116" font-size="20" font-weight="600" fill="#5b7fa6" text-anchor="middle">计划交接（前任在场）</text>
  <rect x="510" y="86" width="330" height="48" rx="9" fill="#f6f3f8" stroke="#6b4d8a" stroke-width="1.5"/>
  <text x="675" y="116" font-size="20" font-weight="600" fill="#6b4d8a" text-anchor="middle">崩溃恢复（前任缺席）</text>

  <!-- row labels -->
  <text x="40" y="188" font-size="20" font-weight="600" fill="#333333">签字</text>
  <text x="40" y="288" font-size="20" font-weight="600" fill="#333333">快照</text>
  <text x="40" y="388" font-size="20" font-weight="600" fill="#333333">在途清单</text>
  <text x="40" y="488" font-size="20" font-weight="600" fill="#333333">就绪确认</text>

  <!-- row 1: authorization -->
  <rect x="150" y="156" width="300" height="52" rx="9" fill="#ffffff" stroke="#c9d6e2" stroke-width="1.5"/>
  <text x="300" y="188" font-size="20" fill="#333333" text-anchor="middle">前任本人签署</text>
  <rect x="510" y="156" width="330" height="52" rx="9" fill="#faf9fb" stroke="#6b4d8a" stroke-width="1.5"/>
  <text x="660" y="188" font-size="20" fill="#333333" text-anchor="middle">预声明的恢复策略代行</text>
  <text x="822" y="188" font-size="20" fill="#c47a4a" text-anchor="middle">▼</text>

  <!-- row 2: snapshot -->
  <rect x="150" y="256" width="300" height="52" rx="9" fill="#ffffff" stroke="#c9d6e2" stroke-width="1.5"/>
  <text x="300" y="288" font-size="20" fill="#333333" text-anchor="middle">前任现场封存（四要素）</text>
  <rect x="510" y="256" width="330" height="52" rx="9" fill="#faf9fb" stroke="#6b4d8a" stroke-width="1.5"/>
  <text x="660" y="288" font-size="20" fill="#333333" text-anchor="middle">最后一次持久检查点</text>
  <text x="822" y="288" font-size="20" fill="#c47a4a" text-anchor="middle">▼</text>

  <!-- row 3: in-flight manifest -->
  <rect x="150" y="356" width="300" height="52" rx="9" fill="#ffffff" stroke="#c9d6e2" stroke-width="1.5"/>
  <text x="300" y="388" font-size="20" fill="#333333" text-anchor="middle">前任亲手封存清单</text>
  <rect x="510" y="356" width="330" height="76" rx="9" fill="#faf9fb" stroke="#6b4d8a" stroke-width="1.5"/>
  <text x="660" y="384" font-size="20" fill="#333333" text-anchor="middle">从账本准入记录推导</text>
  <text x="660" y="414" font-size="20" fill="#666666" text-anchor="middle">前提：准入先于副作用发生</text>
  <text x="822" y="384" font-size="20" fill="#c47a4a" text-anchor="middle">▼</text>

  <!-- row 4: readiness -->
  <rect x="150" y="456" width="300" height="52" rx="9" fill="#ffffff" stroke="#c9d6e2" stroke-width="1.5"/>
  <text x="300" y="488" font-size="20" fill="#333333" text-anchor="middle">继任者确认后才获权</text>
  <rect x="510" y="480" width="330" height="52" rx="9" fill="#f2f8f5" stroke="#4a9d7f" stroke-width="2"/>
  <text x="660" y="512" font-size="20" fill="#333333" text-anchor="middle">门槛不降：就绪先于获权</text>
  <text x="822" y="512" font-size="20" font-weight="600" fill="#4a9d7f" text-anchor="middle">●</text>

  <!-- legend -->
  <text x="530" y="566" font-size="20" fill="#c47a4a">▼ 如实降级的输入</text>
  <text x="720" y="566" font-size="20" fill="#4a9d7f">● 保证不变</text>

  <!-- bottom: suspension path -->
  <rect x="150" y="586" width="690" height="44" rx="9" fill="#fdf6f5" stroke="#c98a80" stroke-width="1.5"/>
  <text x="495" y="614" font-size="20" fill="#333333" text-anchor="middle">材料凑不齐门槛 → 显式悬置：授权冻结＋处置责任记名，停在可审计的安全态</text>

  <!-- risk marker note -->
  <text x="40" y="566" font-size="20" fill="#666666">清单覆盖不完整 → 风险标记＋悲观对账</text>
</svg>
