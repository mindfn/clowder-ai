threadPolicy:
  role: working-home
  stateSot: registry
  allowedContent:
    - longitudinal-analysis
    - verdict-discussion
    - handoff-drafts
legacyScheduledTaskIds: []
handoffTargetResolver:
  featureId: F257
  ownerCatId: opus-47
  threadLookup: feature-thread
sla:
  acknowledgeHours: 48
  reevalWithinHours: 168
# Phase A Line B: producers wired (hold_ball 429 + block_pingpong emits).
# Eval engine wiring: generator adapter → publish_verdict pipeline green.
# Kept disabled until eval cat has data access to guard rejection events
# (pre-injection snapshot or query tool). Without data access, weekly trigger
# would produce evidence-free verdicts. See codex review on PR #24.
enabled: false
